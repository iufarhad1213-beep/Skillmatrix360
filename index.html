<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillMatrix360 — Mainetti (Bangladesh) Pvt. Ltd.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    /* =========================================================
   SkillMatrix360 — Design System
   ========================================================= */
    :root {
      --bg: #F3F5FB;
      --bg-elev: #FFFFFF;
      --card: rgba(255, 255, 255, 0.75);
      --card-solid: #FFFFFF;
      --border: rgba(15, 23, 42, 0.08);
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #9B1B2E;
      --primary-dark: #711420;
      --primary-light: #FBEAEC;
      --accent: #C6293C;
      --green: #16A34A;
      --green-bg: #DCFCE7;
      --amber: #D97706;
      --amber-bg: #FEF3C7;
      --red: #DC2626;
      --red-bg: #FEE2E2;
      --blue-bg: #DBEAFE;
      --blue: #2563EB;
      --gray-bg: #E2E8F0;
      --gray: #475569;
      --shadow: 0 10px 30px rgba(30, 41, 80, 0.08);
      --shadow-sm: 0 2px 8px rgba(30, 41, 80, 0.06);
      --radius: 18px;
      --radius-sm: 12px;
      --sidebar-w: 250px;
      --font-display: 'Poppins', 'Segoe UI', sans-serif;
      --font-body: 'Inter', 'Segoe UI', sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0B1120;
      --bg-elev: #111827;
      --card: rgba(23, 31, 50, 0.75);
      --card-solid: #141B2E;
      --border: rgba(255, 255, 255, 0.08);
      --text: #E5E9F5;
      --text-muted: #94A3B8;
      --primary: #DE4A5C;
      --primary-dark: #EF7A88;
      --primary-light: #3A151B;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-display);
      margin: 0 0 4px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 8px;
    }

    .muted {
      color: var(--text-muted);
      font-size: 13.5px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: var(--font-body);
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: var(--font-body);
    }

    #root {
      min-height: 100vh;
    }

    .fade-in {
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ---------- LOGIN (kept: .chip / .chip-round are shared with the app header, do not remove) ---------- */
    .chip {
      border: 1px solid var(--border);
      background: #F1F3F8;
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
    }

    [data-theme="dark"] .chip {
      background: #151D30;
    }

    .chip-round {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    /* ---------- LOGIN v2 (reference-style redesign, namespaced under .lg-) ---------- */
    .lg-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #798291;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    [data-theme="dark"] .lg-wrap {
      background: #0B0E15;
    }

    .lg-card {
      display: flex;
      width: min(1080px, 100%);
      min-height: 640px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.32);
      background: #FFFFFF;
      position: relative;
    }

    [data-theme="dark"] .lg-card {
      background: #0C1220;
    }

    /* ---- LEFT PANEL ---- */
    .lg-left {
      flex: 0 0 44%;
      max-width: 44%;
      padding: 36px 44px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #FFFFFF;
      position: relative;
      z-index: 2;
    }

    [data-theme="dark"] .lg-left {
      background: #0C1220;
    }

    .lg-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .lg-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .lg-brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 19px;
      box-shadow: 0 6px 16px rgba(155, 27, 46, 0.35);
    }

    .lg-brand-text {
      line-height: 1.15;
    }

    .lg-brand-text .name {
      font-weight: 800;
      font-size: 19px;
      color: #0F172A;
      letter-spacing: -0.01em;
    }

    [data-theme="dark"] .lg-brand-text .name {
      color: #F1F5F9;
    }

    .lg-brand-text .name .num {
      color: var(--primary);
    }

    .lg-brand-text .sub {
      font-size: 9.5px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: .01em;
      margin-top: 2px;
      max-width: 190px;
    }

    .lg-controls {
      display: flex;
      gap: 8px;
      flex: none;
    }

    .lg-lang-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: #374151;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    [data-theme="dark"] .lg-lang-btn {
      background: #151D30;
      color: #E2E8F0;
      border-color: rgba(255, 255, 255, .1);
    }

    .lg-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      cursor: pointer;
      color: #374151;
    }

    [data-theme="dark"] .lg-icon-btn {
      background: #151D30;
      color: #E2E8F0;
      border-color: rgba(255, 255, 255, .1);
    }

    .lg-heading h1 {
      font-size: 29px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 3px;
      letter-spacing: -0.01em;
    }

    [data-theme="dark"] .lg-heading h1 {
      color: #F1F5F9;
    }

    .lg-heading p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .lg-group {
      margin-bottom: 15px;
    }

    .lg-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    [data-theme="dark"] .lg-group label {
      color: #E2E8F0;
    }

    .lg-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .lg-input-wrap i.lg-input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 13.5px;
      pointer-events: none;
    }

    .lg-input-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 12.5px;
      outline: none;
      color: var(--text);
      transition: border-color .2s;
    }

    [data-theme="dark"] .lg-input-wrap input {
      background: #131B2C;
    }

    .lg-input-wrap input:focus {
      border-color: var(--primary);
    }

    .lg-input-wrap .lg-eye-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13.5px;
      padding: 4px;
    }

    .lg-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      margin: 6px 0 20px;
    }

    .lg-remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #334155;
      font-weight: 600;
      cursor: pointer;
    }

    [data-theme="dark"] .lg-remember {
      color: #E2E8F0;
    }

    .lg-remember input {
      accent-color: var(--primary);
      width: 14px;
      height: 14px;
    }

    .lg-forgot {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .lg-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(155, 27, 46, 0.35);
      transition: transform .15s, box-shadow .15s;
    }

    .lg-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(155, 27, 46, 0.42);
    }

    .lg-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .lg-error {
      background: var(--red-bg);
      color: var(--red);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      margin-top: 13px;
    }

    .lg-demo {
      margin-top: 20px;
      background: #fdf2f2;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }

    [data-theme="dark"] .lg-demo {
      background: #2A1218;
    }

    .lg-demo i {
      color: var(--primary);
      font-size: 21px;
      margin-top: 1px;
    }

    .lg-demo-text {
      font-size: 10.5px;
      line-height: 1.55;
      color: #475569;
    }

    [data-theme="dark"] .lg-demo-text {
      color: #CBD5E1;
    }

    .lg-demo-text strong {
      color: #0f172a;
      display: block;
      margin-bottom: 2px;
      font-size: 11.5px;
    }

    [data-theme="dark"] .lg-demo-text strong {
      color: #F1F5F9;
    }

    .lg-demo-text b {
      color: #0f172a;
      font-weight: 700;
    }

    [data-theme="dark"] .lg-demo-text b {
      color: #E2E8F0;
    }

    /* ---- RIGHT PANEL ---- */
    .lg-right {
      flex: 1;
      position: relative;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 32px 42px;
      background:
        linear-gradient(to bottom, rgba(8, 10, 18, 0.35) 0%, rgba(20, 0, 5, 0.72) 55%, rgba(139, 20, 35, 0.95) 100%),
        url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1200&q=80') center/cover;
    }

    .lg-right-glow {
      position: absolute;
      bottom: -30px;
      left: 0;
      right: 0;
      height: 180px;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at bottom, rgba(230, 0, 30, 0.55) 0%, rgba(120, 0, 15, 0.75) 50%, transparent 80%);
    }

    .lg-right-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .lg-factory-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .lg-factory-header svg {
      width: 46px;
      height: 46px;
      flex: none;
    }

    .lg-factory-header .l1 {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: .6px;
      text-align: right;
      line-height: 1;
    }

    .lg-factory-header .l2 {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1.4px;
      opacity: .85;
      text-align: right;
      margin-top: 3px;
    }

    .lg-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 230px;
      margin-top: 14px;
    }

    .lg-glass-btn {
      background: linear-gradient(90deg, rgba(140, 0, 20, 0.85), rgba(70, 0, 10, 0.9));
      border: 1px solid rgba(255, 60, 80, 0.4);
      border-radius: 12px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 0 10px rgba(220, 0, 30, 0.25);
    }

    .lg-glass-btn .lg-gb-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .lg-glass-btn .lg-gb-left i {
      font-size: 14px;
      color: #fff;
      width: 16px;
      text-align: center;
    }

    .lg-glass-btn .lg-gb-left span {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .lg-glass-btn .lg-gb-arrow {
      font-size: 9px;
      opacity: .75;
    }

    .lg-slogan {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: .1px;
    }

    .lg-flow-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .lg-flow {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lg-flow-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
    }

    .lg-flow-item .lg-fi-icon {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
    }

    .lg-flow-item span {
      font-size: 7.8px;
      font-weight: 600;
      line-height: 1.15;
      opacity: .9;
    }

    .lg-flow-arrow {
      font-size: 8px;
      opacity: .5;
      margin-bottom: 11px;
    }

    .lg-bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 60px;
      position: relative;
    }

    .lg-bar-chart .lg-bar {
      width: 8px;
      background: linear-gradient(to top, rgba(230, 0, 30, 0.8), rgba(255, 100, 110, 0.9));
      border-radius: 4px 4px 0 0;
    }

    .lg-bar-chart .lg-bar:nth-child(1) {
      height: 14px;
    }

    .lg-bar-chart .lg-bar:nth-child(2) {
      height: 23px;
    }

    .lg-bar-chart .lg-bar:nth-child(3) {
      height: 32px;
    }

    .lg-bar-chart .lg-bar:nth-child(4) {
      height: 41px;
    }

    .lg-bar-chart .lg-bar:nth-child(5) {
      height: 50px;
    }

    .lg-bar-chart .lg-bar:nth-child(6) {
      height: 60px;
      background: #ff4d5a;
      box-shadow: 0 0 12px #ff4d5a;
    }

    @media (max-width: 900px) {
      .lg-card {
        flex-direction: column;
        min-height: auto;
        width: 100%;
      }

      .lg-left {
        flex: none;
        max-width: 100%;
        padding: 28px 24px;
      }

      .lg-right {
        order: -1;
        min-height: 300px;
        padding: 24px 26px;
      }

      .lg-menu {
        width: 100%;
      }

      .lg-flow-row {
        flex-wrap: wrap;
        gap: 16px;
      }
    }

    @media (max-width: 480px) {
      .lg-wrap {
        padding: 0;
      }

      .lg-card {
        border-radius: 0;
      }

      .lg-heading h1 {
        font-size: 25px;
      }

      .lg-factory-header {
        justify-content: flex-start;
      }

      .lg-factory-header .l1,
      .lg-factory-header .l2 {
        text-align: left;
      }
    }

    /* ---------- SHELL ---------- */
    .shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--card-solid);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 20px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    #navList {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow-y: auto;
    }

    .navlink {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: background .15s, color .15s;
    }

    .navlink .nicon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }

    .navlink:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .navlink.active {
      background: linear-gradient(135deg, var(--primary), #C6293C);
      color: #fff;
      box-shadow: 0 6px 16px rgba(155, 27, 46, 0.28);
    }

    .nav-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .nav-group-header:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .nav-group-header .nicon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }

    .nav-group-chevron {
      margin-left: auto;
      font-size: 11px;
      transition: transform .2s;
    }

    .nav-group.open .nav-group-chevron {
      transform: rotate(90deg);
    }

    .nav-group.open .nav-group-header {
      color: var(--primary);
    }

    .nav-sublist {
      max-height: 0;
      overflow: hidden;
      transition: max-height .2s ease;
      padding-left: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-group.open .nav-sublist {
      max-height: 260px;
    }

    .navlink-sub {
      font-size: 13px;
      padding: 8px 12px;
    }

    .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }

    .btn-logout {
      width: 100%;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topheader {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 26px;
      background: var(--card-solid);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text);
    }

    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 16px;

    .avatar {

      height: 32px;
      border-radius: 50%;

      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      overflow: hidden;
    }

      height: 100%;

    .uname {

      font-weight: 700;
    }

    .urole {
      font-size: 10px;
      color: var(--text-muted);
    }

    .content {
      padding: 26px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;

    .page-head h1 {
      font-size: 24px;
    }

    /* ---------- Cards / KPI / Panel ---------- */
    .panel {
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .panel h3 {
      font-size: 15.5px;
      margin-bottom: 14px;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 260px;
    }

    .chart-box canvas {
      max-width: 100%;
    }

    @media (max-width:640px) {
      .chart-box {
        height: 220px;
      }
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .kpi-grid-8 {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .kpi-card {
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      transition: transform .15s, box-shadow .15s;
    }

    .kpi-card.clickable,
    .kpi-card[data-clickable] {
      cursor: pointer;
    }

    .kpi-card.clickable:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .kpi-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-display);
    }

    .kpi-label {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      opacity: .8;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media(max-width:920px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- Executive KPI Cards (Overview, sparkline style) ---------- */
    .exec-kpi-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      margin-bottom: 22px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .exec-kpi-grid .exec-kpi-card {
      flex: 1 1 0;
      min-width: 135px;
    }

    @media (max-width:900px) {
      .exec-kpi-grid .exec-kpi-card {
        min-width: 150px;
      }
    }

    .exec-kpi-card {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .exec-kpi-card.clickable {
      cursor: pointer;
    }

    .exec-kpi-card.clickable:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .exec-kpi-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .exec-kpi-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .exec-kpi-value {
      font-size: 22px;
      font-weight: 800;
      font-family: var(--font-display);
      color: var(--text);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .exec-kpi-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-top: 6px;
    }

    .exec-kpi-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      margin-bottom: 6px;
    }

    .exec-kpi-spark {
      margin-top: auto;
      height: 32px;
    }

    .exec-kpi-spark-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ov2-head-actions {

      gap: 10px;
      flex-wrap: wrap;
    }

    .ov2-filter-btn {

      font-weight: 700;
      background: var(--card-solid);

    }

    }

      display: inline-block;
      width: 7px;

    .ov2-section-label {

      font-weight: 800;

      align-items: flex-start;
      gap: 12px;
      margin: 4px 0 16px;

      justify-content: center;

    .ov2-section-titles {
      display: flex;

      gap: 8px;
      padding-top: 6px;
      flex-wrap: wrap;
    }

    .ov2-section-title {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;

    @media(max-width:520px) {

      }
    }

    .ov2-kpi-grid-8 {
      grid-template-columns: repeat(8, 1fr);
    }

    @media(max-width:1400px) {

        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media(max-width:980px) {
      .ov2-kpi-grid-8 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:520px) {
      .ov2-kpi-grid-8 {
        grid-template-columns: 1fr;
      }
    }

    .ov2-kpi-card {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
    }

    .ov2-kpi-card.clickable {
      cursor: pointer;
    }

    .ov2-kpi-card.clickable:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .ov2-kpi-body {
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .ov2-kpi-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ov2-kpi-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex: none;
    }

    .ov2-kpi-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      line-height: 1.25;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;

    .ov2-kpi-value {

      color: var(--text);

    }

    .ov2-kpi-progress-track {
      height: 6px;
      border-radius: 999px;

      overflow: hidden;
    }

    [data-theme="dark"] .ov2-kpi-progress-track {
      background: rgba(255, 255, 255, .12);
    }

    .ov2-kpi-progress-fill {

    .ov2-kpi-footer i {

      color: var(--text);

    .mp-legend-value span {

      font-weight: 700;
      color: var(--text);

    }

    [data-theme="dark"] .dept-status-table tbody tr.dept-total-row {
      background: rgba(220, 38, 38, 0.14);
    }

    .dept-name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .dept-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }

    .dept-gap-link {
      color: var(--red);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .dept-gap-link:hover {
      opacity: 0.75;
    }

    .dept-completion-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dept-completion-pct {
      color: var(--green);
      font-weight: 700;
      min-width: 36px;
    }

    .dept-progress-track {
      flex: 1;
      min-width: 90px;
      height: 7px;
      border-radius: 999px;
      background: var(--gray-bg);
      overflow: hidden;
    }

    .dept-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--green);
    }

    /* ---------- Table ---------- */
    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 600px;
    }

    .data-table th {
      background: var(--bg);
      text-align: left;
      padding: 11px 14px;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--text-muted);
      position: sticky;
      top: 0;
    }

    .data-table td {
      padding: 11px 14px;
      border-top: 1px solid var(--border);
    }

    .data-table tr.row-click,
    .data-table tr.row-click-skill {
      cursor: pointer;
    }

    .data-table tr.row-click:hover,
    .data-table tr.row-click-skill:hover {
      background: var(--primary-light);
    }

    /* ---------- Pills ---------- */
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .pill-green {
      background: var(--green-bg);
      color: var(--green);
    }

    .pill-amber {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .pill-red {
      background: var(--red-bg);
      color: var(--red);
    }

    .pill-blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .pill-gray {
      background: var(--gray-bg);
      color: var(--gray);
    }

    .legend-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    /* ---------- Select / Inputs ---------- */
    .select,
    .input-inline {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .btn-outline {
      background: none;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-small {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 7px 12px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 12.5px;
    }

    .btn-small.danger {
      background: var(--red-bg);
      color: var(--red);
    }

    .btn-small.active {
      background: var(--primary);
      color: #fff;
    }

    .view-toggle {
      display: flex;
      gap: 6px;
    }

    /* ---------- Course Cards ---------- */
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .course-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .15s;
      position: relative;
    }

    .course-card:hover {
      transform: translateY(-3px);
    }

    .course-card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }

    .course-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.55);
      color: #fff;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s;
    }

    .course-icon-btn:hover {
      background: var(--primary);
    }

    .course-icon-btn.remove-topic:hover {
      background: var(--red);
    }

    .course-thumb {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: linear-gradient(135deg, var(--primary-light), var(--bg));
    }

    .course-thumb.video {
      background: linear-gradient(135deg, #EDE9FE, var(--bg));
    }

    .course-body {
      padding: 14px;
    }

    .course-body h4 {
      font-size: 14.5px;
    }

    .course-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .course-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .progress-bar {
      height: 7px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-bar.big {
      height: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #C6293C);
      border-radius: 999px;
      transition: width .3s;
    }

    .media-video {
      background: #0F172A;
      color: #fff;
      height: 220px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .video-player {
      position: relative;
      height: 220px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      background: #0F172A;
      cursor: pointer;
      user-select: none;
    }

    .video-stage {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.35), transparent 55%),
        radial-gradient(circle at 75% 75%, rgba(236, 72, 153, 0.28), transparent 50%),
        linear-gradient(135deg, #0F172A, #1E1B4B 60%, #0F172A);
      background-size: 220% 220%, 220% 220%, 100% 100%;
      animation: videoDrift 6s ease-in-out infinite;
      opacity: 0.55;
    }

    .video-player:not(.playing) .video-stage {
      animation-play-state: paused;
    }

    @keyframes videoDrift {
      0% {
        background-position: 0% 0%, 100% 100%, 0 0;
      }

      50% {
        background-position: 100% 60%, 0% 30%, 0 0;
      }

      100% {
        background-position: 0% 0%, 100% 100%, 0 0;
      }
    }

    .video-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 20px;
    }

    .video-scene-icon {
      font-size: 52px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
      animation: sceneIconPop .5s ease;
      line-height: 1;
    }

    .video-scene-caption {
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      max-width: 340px;
      opacity: 0.92;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    @keyframes sceneIconPop {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(8px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .video-player:not(.playing):not(.done) .video-scene-caption {
      display: none;
    }

    .video-scene-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(3px);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .03em;
      padding: 4px 9px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      z-index: 2;
      text-align: center;
      padding: 16px;
    }

    .video-play-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(4px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform .15s, background .15s;
    }

    .video-player:hover .video-play-btn {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.22);
    }

    .video-title-label {
      font-weight: 600;
      font-size: 14.5px;
    }

    .video-sub-label {
      font-size: 11.5px;
      opacity: 0.75;
    }

    .video-player.playing .video-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .video-player.done .video-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .video-bottombar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      padding: 10px 12px 12px;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.55), transparent);
    }

    .video-progress-track {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
      margin-bottom: 6px;
    }

    .video-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #E8A33D);
      border-radius: 999px;
    }

    .video-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
    }

    .video-badge-done {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      background: var(--green);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .video-player.done .video-badge-done {
      display: flex;
    }

    .media-pdf {
      background: var(--bg);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .obj-list {
      margin: 0 0 16px;
      padding-left: 18px;
      font-size: 13.5px;
      line-height: 1.8;
    }

    .assess-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .assess-row p {
      font-size: 12px;
    }

    .banner-success {
      background: var(--green-bg);
      color: var(--green);
      padding: 12px 16px;
      border-radius: 12px;
      margin: 14px 0;
      font-size: 13.5px;
      font-weight: 600;
    }

    .banner-success.small {
      padding: 6px 10px;
      font-size: 11.5px;
      margin: 8px 0;
    }

    .material-upload-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 10px 0 14px;
      flex-wrap: wrap;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .material-upload-row select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-solid);
      color: var(--text);
      font-size: 13px;
    }

    .material-upload-row input[type=file] {
      font-size: 12.5px;
      max-width: 220px;
    }

    .material-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .material-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-solid);
    }

    .material-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .material-info {
      flex: 1;
      min-width: 0;
    }

    .material-info b {
      display: block;
      font-size: 13.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .material-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .material-viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .size-toggle {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: 999px;
      padding: 3px;
    }

    .size-btn {
      border: none;
      background: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .material-viewer-stage {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      transition: height .2s ease;
    }

    .material-viewer-stage embed,
    .material-viewer-stage video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .material-viewer[data-size="small"] .material-viewer-stage {
      height: 260px;
    }

    .material-viewer[data-size="medium"] .material-viewer-stage {
      height: 460px;
    }

    .material-viewer[data-size="large"] .material-viewer-stage {
      height: 78vh;
    }

    .material-viewer-stage:fullscreen {
      height: 100vh;
    }

    .material-viewer-stage:fullscreen embed,
    .material-viewer-stage:fullscreen video {
      height: 100vh;
    }

    /* ---------- Assessment ---------- */
    .assess-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 14px;
      flex-wrap: wrap;
    }

    .timer {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 15px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: border-color .15s, background .15s;
    }

    .option-row:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    #writtenArea {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      margin-top: 12px;
      resize: vertical;
    }

    .assess-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .q-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 400px;
    }

    .qdot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gray-bg);
    }

    .qdot.answered {
      background: var(--green);
    }

    .qdot.active {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }

    .result-header.pass {
      background: var(--green-bg);
    }

    .result-header.fail {
      background: var(--amber-bg);
    }

    .result-score {
      font-size: 48px;
      font-weight: 800;
      font-family: var(--font-display);
    }

    .dev-panel {
      border: 1.5px solid var(--amber);
    }

    .weak-topics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .dev-actions {
      display: flex;
      gap: 12px;
    }

    .answer-row {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
    }

    .answer-row.ok {
      color: var(--text);
    }

    .explain {
      color: var(--text-muted);
      margin-top: 4px;
    }

    .written-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 8px;
    }

    .written-compare div {
      background: var(--bg);
      padding: 12px;
      border-radius: 10px;
    }

    .written-compare label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* ---------- Schedule ---------- */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .schedule-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .sc-status {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .sc-row {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 4px 0;
    }

    .sc-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .cal-month {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .cal-item {
      font-size: 12px;
      padding: 6px 8px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    /* ---------- Certificates ---------- */
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .cert-card {
      background: var(--card);
      border: 1.5px solid var(--primary-light);
      border-radius: var(--radius-sm);
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .cert-ribbon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    /* ---------- Notifications ---------- */
    .notif-card {
      display: flex;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .notif-card.unread {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .notif-icon {
      font-size: 20px;
    }

    .sms-log {
      background: var(--bg);
      font-size: 11.5px;
      padding: 8px 10px;
      border-radius: 8px;
      margin: 8px 0;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* ---------- Profile ---------- */
    .profile-panel {
      display: flex;
      gap: 22px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #C6293C);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      overflow: hidden;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-photo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .photo-upload-btn {
      cursor: pointer;
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      background: var(--primary-light);
      padding: 6px 14px;
      border-radius: 999px;
      text-align: center;
      display: inline-block;
    }

    .photo-remove-btn {
      cursor: pointer;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
      background: none;
      border: none;
      text-decoration: underline;
    }

    .modal-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--primary), #C6293C);

    const DEPARTMENTS = ["Production", "Quality", "Maintenance", "Engineering", "Supply Chain", "Warehouse", "HR & Administration", "EHS", "IT", "Finance"];

    /* Ensures a department exists in DEPARTMENTS (case-insensitive match); auto-creates it
       (with a generic skill set) if it doesn't, and returns the canonical department name. */
    function ensureDepartment(rawName) {
      const name = String(rawName || "").trim();
      if (!name) return null;
      const existing = DEPARTMENTS.find(d => d.toLowerCase() === name.toLowerCase());
      if (existing) return existing;
      DEPARTMENTS.push(name);
      if (!SKILLS_BY_DEPT[name]) SKILLS_BY_DEPT[name] = GENERIC_DEPT_SKILLS.slice();

      return name;

    /* ---------- Seeded RNG (deterministic demo data) ---------- */
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }
    let RNG = mulberry32(20260101);
    function rand() { return RNG(); }
    function randInt(min, max) { return Math.floor(rand() * (max - min + 1)) + min; }
    function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
    function pad(n, len) { return String(n).padStart(len, '0'); }
    function fmtDate(d) { return d.toISOString().slice(0, 10); }
    function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }

    function generateEmployees(count) {
      const employees = [];
      let empN = 1001;
      for (let i = 0; i < count; i++) {
        const dept = DEPARTMENTS[i % DEPARTMENTS.length];
        const gender = rand() < 0.78 ? "Male" : "Female";
        const name = gender === "Male" ? pick(MALE_NAMES) : pick(FEMALE_NAMES);
        const designation = pick(DESIGNATIONS[dept]);
        const empType = rand() < 0.8 ? "Permanent" : "Contract";
        const joinYearsAgo = randInt(0, 8);
        const joining = addDays(new Date(2026, 0, 1), -joinYearsAgo * 365 - randInt(0, 300));
        const id = "EMP" + (empN++);
        const skillsList = SKILLS_BY_DEPT[dept];
        const skills = skillsList.map(sk => {
          const required = randInt(2, 4);
          let current = Math.max(0, required - randInt(-1, 3));
          current = Math.min(5, current);
          return { skill: sk, required, current, gap: required - current };
        });
        const supervisor = pick(SUPERVISOR_POOL);
        employees.push({
          id, name, gender, department: dept, designation, empType,
          joining: fmtDate(joining), supervisor, skills,
          photoInitials: name.split(' ').map(p => p[0]).slice(0, 2).join(''),
          password: "Mainetti@123", role: "employee"
        });
      }
      return employees;
    }

    function generateSchedule(employees) {
      const schedule = [];
      const venues = ["Training Room 01", "Training Room 02", "Conference Hall A", "Assembly Hall", "Workshop Bay 3"];
      let sid = 1;
      for (let m = 0; m < 12; m++) {
        const numTrainings = randInt(2, 4);
        for (let k = 0; k < numTrainings; k++) {
          const course = pick(COURSES);
          const dept = course.dept;
          const day = randInt(1, 26);
          const date = new Date(2026, m, day);
          const hour = pick([9, 10, 11, 14, 15]);
          const participants = employees.filter(e => e.department === dept)
            .filter(() => rand() < 0.35).map(e => e.id).slice(0, 15);
          schedule.push({
            id: "TRN" + pad(sid++, 3),
            title: course.title + " Training",
            courseId: course.id,
            department: dept,
            date: fmtDate(date),
            time: (hour < 12 ? hour + ":00 AM" : (hour === 12 ? "12:00 PM" : (hour - 12) + ":00 PM")),
            venue: pick(venues),
            duration: course.duration,
            trainer: pick(TRAINER_POOL),
            participants,
            status: date < new Date(2026, 7, 23) ? "Completed" : (date < addDays(new Date(2026, 7, 23), 14) ? "Upcoming" : "Planned")
          });
        }
      }
      return schedule;
    }

    function generateAssessmentHistory(employees, schedule) {
      // seed some historical attempts so Training Effectiveness / results have data
      employees.forEach(emp => {
        emp.attempts = {}; // courseId -> [{date,score,passed,answers}]
        emp.trainingRecords = []; // {trainingId, status, completedDate}
        emp.attendance = []; // {trainingId, status}
        emp.notifications = [];
        emp.progress = {}; // courseId -> {progress, completed}
      });
      schedule.forEach(tr => {
        tr.participants.forEach(empId => {
          const emp = employees.find(e => e.id === empId);
          if (!emp) return;
          const attended = rand() < 0.9;
          const status = tr.status === "Completed" ? (attended ? pick(["Present", "Present", "Present", "Late"]) : "Absent") : "Scheduled";
          emp.attendance.push({ trainingId: tr.id, title: tr.title, date: tr.date, status });
          const preScore = randInt(40, 75);
          let trainingStatus = "Pending";
          let completedDate = null;
          emp.progress[tr.courseId] = emp.progress[tr.courseId] || { progress: 0, completed: false };
          if (tr.status === "Completed" && attended) {
            emp.progress[tr.courseId] = { progress: 100, completed: true };
            const postScore = Math.min(98, preScore + randInt(10, 35));
            const passed = postScore >= 70;
            emp.attempts[tr.courseId] = emp.attempts[tr.courseId] || [];
            emp.attempts[tr.courseId].push({ date: tr.date, type: "pre", score: preScore, passed: preScore >= 70 });
            emp.attempts[tr.courseId].push({ date: tr.date, type: "post", score: postScore, passed });
            trainingStatus = passed ? "Completed" : "Development Required";
            completedDate = tr.date;
          } else if (tr.status === "Upcoming") {
            trainingStatus = "Upcoming";
            emp.notifications.push({
              id: "N" + emp.id + tr.id, type: "training_assigned", read: false, date: fmtDate(addDays(new Date(2026, 7, 23), -2)),
              title: "Training Assigned",
              body: `You have been assigned to ${tr.title} on ${tr.date} at ${tr.time}, ${tr.venue}.`,
              sms: `Dear ${emp.id}, you are scheduled for ${tr.title} on ${tr.date} at ${tr.time}.`
            });
          } else if (tr.status === "Planned") {
            trainingStatus = "Planned";
          }
          emp.trainingRecords.push({
            trainingId: tr.id, title: tr.title, courseId: tr.courseId, department: tr.department,
            date: tr.date, status: trainingStatus, completedDate
          });
        });
      });
    }

        });
      });

      assignLoginIds(db);
      return { db, migrated };
    }

    async function loadDB() {
      if (sb) {
        try {
          const { data, error } = await sb.from('app_state').select('data').eq('id', CLOUD_ROW_ID).maybeSingle();
          if (!error && data && data.data) {
            const { db } = migrateDB(data.data);
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            pushToCloud(db);
            return db;
          }
        } catch (e) { console.warn('[SkillMatrix360] Supabase unreachable, falling back to local cache:', e); }
      }
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          const { db } = migrateDB(parsed);
          localStorage.setItem(DB_KEY, JSON.stringify(db));
          pushToCloud(db); // seed the cloud if it was empty / unreachable a moment ago
          return db;
        } catch (e) { /* fallthrough */ }
      }
      const db = buildDatabase();
      assignLoginIds(db);
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      pushToCloud(db);
      return db;
    }
    function saveDB(db) {
      assignLoginIds(db);
      db.departments = [...DEPARTMENTS];
      db.jobRoles = db.jobRoles || [];
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      pushToCloud(db);
    }

    function loadPrefs() {
      const raw = localStorage.getItem(PREFS_KEY);
      return raw ? JSON.parse(raw) : { theme: "light", lang: "en" };
    }
    function savePrefs(p) { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }

    function loadSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    }
    function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
    function clearSession() { localStorage.removeItem(SESSION_KEY); }

    /* ---------- Auth ---------- */
    function authenticate(rawId, password) {
      const db = App.db;
      const typed = (rawId || "").trim();
      const typedUpper = typed.toUpperCase();
      if (db.admin.id === typedUpper && db.admin.password === password) return { role: "admin", id: db.admin.id };
      if (db.trainer.id === typedUpper && db.trainer.password === password) return { role: "trainer", id: db.trainer.id };
      // Employees log in with their name-based Login ID (case-insensitive); Employee ID also still works.
      const emp = db.employees.find(e =>
        (e.loginId && e.loginId.toLowerCase() === typed.toLowerCase()) || e.id === typedUpper
      );
      if (emp && emp.password === password) return { role: "employee", id: emp.id };
      return null;
    }
    function currentUser() {
      const s = App.session;
      if (!s) return null;
      if (s.role === "admin") return App.db.admin;
      if (s.role === "trainer") return App.db.trainer;
      return App.db.employees.find(e => e.id === s.id);
    }

    /* ---------- Derived / Computed KPIs ---------- */
    function computeKPIs(db, deptFilter) {
      const dept = deptFilter && deptFilter !== "All" ? deptFilter : null;
      const emps = dept ? db.employees.filter(e => e.department === dept) : db.employees;
      const total = emps.length;
      let assignedCount = 0, completedCount = 0, passCount = 0, assessCount = 0;
      let presentCount = 0, attRecCount = 0;
      let reqSkills = 0, metSkills = 0;
      let gapEmployees = 0;
      emps.forEach(e => {
        e.trainingRecords.forEach(tr => { assignedCount++; if (tr.status === "Completed") completedCount++; });
        Object.values(e.attempts).forEach(list => list.forEach(a => { if (a.type === "post") { assessCount++; if (a.passed) passCount++; } }));
        e.attendance.forEach(a => { attRecCount++; if (a.status === "Present" || a.status === "Late") presentCount++; });
        let hasGap = false;
        e.skills.forEach(sk => { reqSkills++; if (sk.current >= sk.required) metSkills++; if (sk.gap > 0) hasGap = true; });
        if (hasGap) gapEmployees++;
      });
      const scheduleScope = dept ? db.schedule.filter(s => s.department === dept) : db.schedule;
      const activeTraining = scheduleScope.filter(s => s.status === "Upcoming").length;
      const upcomingTraining = scheduleScope.filter(s => s.status === "Planned").length;
      const deptRows = buildDeptStatusRows(db, deptFilter);
      const trainingRequiredRecords = deptRows.reduce((a, r) => a + r.trainingNeeded, 0);
      const criticalDepartments = deptRows.filter(r => r.completionPct < 20).length;
      return {
        totalManpower: total,
        trainingCompletionPct: assignedCount ? Math.round(completedCount / assignedCount * 100) : 0,
        trainingGapEmployees: gapEmployees,
        assessmentPassRate: assessCount ? Math.round(passCount / assessCount * 100) : 0,
        attendanceRate: attRecCount ? Math.round(presentCount / attRecCount * 100) : 0,
        skillCoverage: reqSkills ? Math.round(metSkills / reqSkills * 100) : 0,
        activeTraining, upcomingTraining, trainingRequiredRecords, criticalDepartments
      };
    }

    /* ---------- Auto Training Reminders (2 days before session) ---------- */
    function runTrainingReminders(db) {
      const today = appToday();
      let changed = false;
      db.schedule.forEach(tr => {
        const trDate = new Date(tr.date);
        const diffDays = Math.round((trDate - today) / 86400000);
        if (diffDays >= 0 && diffDays <= 2) {
          tr.participants.forEach(empId => {
            const emp = db.employees.find(e => e.id === empId);
            if (!emp) return;
            emp.notifications = emp.notifications || [];
            const already = emp.notifications.some(n => n.type === "training_reminder" && n.trainingId === tr.id);
            if (!already) {
              emp.notifications.unshift({
                id: "NR" + emp.id + tr.id, type: "training_reminder", trainingId: tr.id, read: false,
                date: fmtDate(today),
                title: "Training Reminder",
                body: `Reminder: "${tr.title}" is scheduled on ${tr.date} at ${tr.time}, ${tr.venue}. Please attend on time.`,
                sms: `Dear ${emp.id}, reminder: your training "${tr.title}" is on ${tr.date} at ${tr.time}, ${tr.venue}.`
              });
              changed = true;
            }
          });
        }
      });
      if (changed) saveDB(db);
    }

    function gapCategory(gap) {
      if (gap >= 3) return "Critical";
      if (gap === 2) return "High";
      if (gap === 1) return "Medium";
      return "None";
    }

    function allSkillGapRows(db, deptFilter) {
      const rows = [];
      db.employees.forEach(e => {
        if (deptFilter && deptFilter !== "All" && e.department !== deptFilter) return;
        e.skills.forEach(sk => {
          if (sk.gap > 0) {
            rows.push({ empId: e.id, name: e.name, dept: e.department, skill: sk.skill, current: sk.current, required: sk.required, gap: sk.gap, category: gapCategory(sk.gap), supervisor: e.supervisor });
          }
        });
      });
      return rows;
    }

  </script>

    function renderNav(role) {
      const list = NAV[role] || NAV.employee;
      const nav = document.getElementById("navList");
      nav.innerHTML = list.map(item => {
        if (item.group) {
          const subHtml = item.items.map(([hash, icon, label]) => `<a href="${hash}" class="navlink navlink-sub" data-hash="${hash}"><span class="nicon">${icon}</span>${label}</a>`).join('');
          return `<div class="nav-group" data-group="${item.key}">
            <div class="nav-group-header"><span class="nicon">${item.icon}</span>${item.label}<span class="nav-group-chevron">▸</span></div>
            <div class="nav-sublist">${subHtml}</div>
          </div>`;
        }
        const [hash, icon, key] = item;
        return `<a href="${hash}" class="navlink" data-hash="${hash}"><span class="nicon">${icon}</span>${t(key)}</a>`;
      }).join('');
      document.querySelectorAll(".nav-group-header").forEach(h => {
        h.onclick = () => h.parentElement.classList.toggle("open");
      });
      highlightNav();
    }
    function highlightNav() {
      document.querySelectorAll(".navlink").forEach(a => {
        a.classList.toggle("active", location.hash === a.dataset.hash || location.hash.startsWith(a.dataset.hash + "/"));
      });
      document.querySelectorAll(".nav-group").forEach(g => {
        const hasActive = [...g.querySelectorAll(".navlink-sub")].some(a => a.classList.contains("active"));
        if (hasActive) g.classList.add("open");
      });
    }
    function navigate(hash) { location.hash = hash; }

    function updateNotifBadge() {
      const u = currentUser(); const el = document.getElementById("notifCount");
      if (!el) return;
      const n = (u.notifications || []).filter(x => !x.read).length;
      el.textContent = n > 0 ? n : "";
      el.style.display = n > 0 ? "inline-flex" : "none";
    }

    /* ---------- Toast & Modal ---------- */
    function toast(msg) {
      const box = document.getElementById("toastBox");
      if (!box) return;
      const el = document.createElement("div"); el.className = "toast-item"; el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => { el.classList.add("show"); }, 10);
      setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3200);
    }
    function openModal(title, bodyHtml, opts) {
      const backdrop = document.getElementById("modalBackdrop");
      const box = document.getElementById("modalBox");
      box.classList.remove("modal-minimized", "modal-maximized");
      backdrop.classList.remove("backdrop-minimized");
      box.innerHTML = `<div class="modal-head"><h3>${title}</h3><div class="modal-head-actions"><button class="modal-min-btn" id="modalMinBtn" title="Minimize">–</button><button class="modal-max-btn" id="modalMaxBtn" title="Maximize">⛶</button><button class="modal-close" id="modalCloseBtn">✕</button></div></div><div class="modal-body">${bodyHtml}</div>`;
      backdrop.classList.add("show");
      document.getElementById("modalCloseBtn").onclick = (e) => { e.stopPropagation(); closeModal(); };
      document.getElementById("modalMinBtn").onclick = (e) => { e.stopPropagation(); toggleModalMinimize(); };
      document.getElementById("modalMaxBtn").onclick = (e) => { e.stopPropagation(); box.classList.toggle("modal-maximized"); };
      box.onclick = () => { if (box.classList.contains("modal-minimized")) toggleModalMinimize(); };
      if (opts && opts.onOpen) opts.onOpen(box);
    }
    function toggleModalMinimize() {
      const backdrop = document.getElementById("modalBackdrop");
      const box = document.getElementById("modalBox");
      box.classList.remove("modal-maximized");
      box.classList.toggle("modal-minimized");
      backdrop.classList.toggle("backdrop-minimized");
    }
    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("show", "backdrop-minimized");
      document.getElementById("modalBox").classList.remove("modal-minimized", "modal-maximized");
    }

    /* ---------- Global Search ---------- */
    function onGlobalSearch(e) {
      const q = e.target.value.trim().toLowerCase();

      if (q.length < 2) { box.style.display = "none"; return; }

      });
      db.courses.forEach(c => { if (c.title.toLowerCase().includes(q)) results.push({ type: "Course", label: c.title, action: () => navigate("#/course/" + c.id) }); });
      DEPARTMENTS.forEach(d => { if (d.toLowerCase().includes(q)) results.push({ type: "Department", label: d, action: () => { App.state.deptFilter = d; navigate("#/manpower"); } }); });
      const uniqueSkills = [...new Set(Object.values(SKILLS_BY_DEPT).flat())];
      uniqueSkills.forEach(s => { if (s.toLowerCase().includes(q)) results.push({ type: "Skill", label: s, action: () => navigate("#/skillmatrix") }); });
      box.style.display = results.length ? "block" : "none";
      box.innerHTML = results.slice(0, 10).map((r, i) => `<div class="search-row" data-i="${i}"><span class="tag-mini">${r.type}</span> ${r.label}</div>`).join('') || `<div class="search-row muted">No results</div>`;
      box.querySelectorAll(".search-row").forEach((row, i) => {
        row.onclick = () => { results[i].action(); box.style.display = "none"; document.getElementById("globalSearch").value = ""; };
      });
    }

    /* ---------- Shared UI builders ---------- */
    function kpiCard(icon, label, value, sub, onClick) {
      return `<div class="kpi-card" ${onClick ? 'data-clickable="1"' : ''}>
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-label">${label}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
    }
    /* ---------- Executive KPI card with mini sparkline (Overview) ---------- */
    function seededRand(seedStr) {
      let h = 0;
      for (let i = 0; i < seedStr.length; i++) { h = Math.imul(31, h) + seedStr.charCodeAt(i) | 0; }
      return function () {
        h = Math.imul(h ^ (h >>> 15), 1 | h);
        h = (h + Math.imul(h ^ (h >>> 7), 61 | h)) ^ h;
        return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
      };
    }
    function buildSparklineSVG(seedKey, color) {
      const rnd = seededRand(seedKey);
      const n = 7;
      const values = [];
      let v = 30 + rnd() * 20;
      for (let i = 0; i < n; i++) { v += (rnd() - 0.32) * 18; v = Math.max(8, Math.min(92, v)); values.push(v); }
      values[n - 1] = Math.max(values[n - 1], values[n - 2] + 2);
      const w = 110, h = 34, pad = 3;
      const max = Math.max(...values), min = Math.min(...values), range = (max - min) || 1;
      const pts = values.map((val, i) => [pad + i * (w - 2 * pad) / (n - 1), h - pad - ((val - min) / range) * (h - 2 * pad)]);
      let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
        const mx = ((x0 + x1) / 2).toFixed(1);
        d += ` Q${x0.toFixed(1)},${y0.toFixed(1)} ${mx},${((y0 + y1) / 2).toFixed(1)}`;
      }
      d += ` T${pts[n - 1][0].toFixed(1)},${pts[n - 1][1].toFixed(1)}`;
      const last = pts[n - 1];
      const areaD = `${d} L${last[0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
      const gid = "sg_" + seedKey.replace(/[^a-zA-Z0-9]/g, "");
      return `<svg viewBox="0 0 ${w} ${h}" class="exec-kpi-spark-svg" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaD}" fill="url(#${gid})" stroke="none"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/>
  </svg>`;
    }
    function execKpiCard(icon, label, value, sub, go, badgeBg, color) {
      return `<div class="exec-kpi-card${go ? ' clickable' : ''}" ${go ? `data-go="${go}"` : ''}>
    <div class="exec-kpi-top">
      <div class="exec-kpi-badge" style="background:${badgeBg}">${icon}</div>
      <div class="exec-kpi-value">${value}</div>
    </div>
    <div class="exec-kpi-label">${label}</div>
    <div class="exec-kpi-sub">${sub || ''}</div>
    <div class="exec-kpi-spark">${buildSparklineSVG(label, color)}</div>
  </div>`;
    }
    /* ---------- Management Overview v2 KPI card ---------- */
    function ov2KpiCard(cfg) {
      const { iconClass, iconBg, iconColor, title, value, trendText, trendType, go,
        progressPct = null, progressColor = null, footerIcon, footerText, footerBg, footerColor } = cfg;
      const trendIcon = trendType === 'up' ? 'fa-solid fa-arrow-up' : trendType === 'down' ? 'fa-solid fa-arrow-down' : trendType === 'none' ? '' : 'fa-solid fa-minus';
      const trendClass = trendType === 'up' ? 'ov2-trend-up' : trendType === 'down' ? 'ov2-trend-down' : trendType === 'none' ? 'ov2-trend-up' : 'ov2-trend-flat';
      const progress = progressPct != null
        ? `<div class="ov2-kpi-progress-track"><div class="ov2-kpi-progress-fill" style="width:${Math.min(100, Math.max(0, progressPct))}%;background:${progressColor}"></div></div>`
        : '';
      const footer = footerText
        ? `<div class="ov2-kpi-footer" style="background:${footerBg};color:${footerColor}">${footerIcon ? `<i class="${footerIcon}"></i>` : ''} ${footerText}</div>`
        : '';
      return `<div class="ov2-kpi-card${go ? ' clickable' : ''}" ${go ? `data-go="${go}"` : ''}>
    <div class="ov2-kpi-body">
      <div class="ov2-kpi-top">
        <span class="ov2-kpi-icon" style="background:${iconBg};color:${iconColor}"><i class="${iconClass}"></i></span>
        <span class="ov2-kpi-title">${title}</span>
      </div>
      <div class="ov2-kpi-value">${value}</div>
      ${progress}
      <div class="ov2-kpi-trend ${trendClass}">${trendIcon ? `<i class="${trendIcon}"></i>` : ''} ${trendText}</div>
    </div>
    ${footer}
  </div>`;
    }
    function statusPill(status) {
      const map = {
        "Completed": "pill-green", "Present": "pill-green", "Passed": "pill-green", "PASSED": "pill-green",
        "Development Required": "pill-red", "Absent": "pill-red", "Failed": "pill-red", "Critical": "pill-red",
        "Pending": "pill-amber", "Late": "pill-amber", "High": "pill-amber", "Medium": "pill-amber", "Upcoming": "pill-blue",
        "Planned": "pill-gray", "Scheduled": "pill-blue", "None": "pill-green", "Excused": "pill-gray"
      };
      return `<span class="pill ${map[status] || 'pill-gray'}">${status}</span>`;
    }
    function skillPill(gap) {
      if (gap <= 0) return `<span class="pill pill-green">Competent</span>`;
      if (gap === 1) return `<span class="pill pill-amber">Development Required</span>`;
      return `<span class="pill pill-red">Critical Gap</span>`;
    }
    function table(headers, rows) {
      return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    }
    function deptOptions(selected) {
      return `<option value="All" ${selected === 'All' ? 'selected' : ''}>All Departments</option>` +
        DEPARTMENTS.map(d => `<option value="${d}" ${selected === d ? 'selected' : ''}>${d}</option>`).join('');
    }
    function deptOptionsWithAll(selected) {
      return `<option value="All" ${selected === 'All' ? 'selected' : ''}>🌐 All Departments</option>` +
        DEPARTMENTS.map(d => `<option value="${d}" ${selected === d ? 'selected' : ''}>${d}</option>`).join('');
    }
    function courseVisibleToDept(course, dept) { return course.dept === "All" || course.dept === dept; }
    function statusOptions(selected) {
      const statuses = ["All", "Competent", "Development Required", "Critical Gap"];
      return statuses.map(s => `<option value="${s}" ${selected === s ? 'selected' : ''}>${s === "All" ? "All Status" : s}</option>`).join('');
    }

    function openEmployeeProfile(empId) { navigate("#/employee/" + empId); renderEmployeeProfileModal(empId); }

  </script>
  <script>
    /* =========================================================

        const mySkillCov = pct(user.skills.filter(s => s.gap <= 0).length, user.skills.length);

        const pending = user.trainingRecords.filter(r => r.status === "Pending" || r.status === "Development Required").length;

        ${kpiCard("📌", "Pending Training", pending, "")}

            <div><span>${pct(deptEmps.filter(e => e.trainingRecords.some(r => r.status === "Completed")).length, deptEmps.length)}%</span><label>Trained</label></div>
            <div><span>${allSkillGapRows(db, dept).length}</span><label>Open Skill Gaps</label></div>
          </div>
        </div>
        <div class="panel">
          <h3>My Upcoming Training</h3>
          ${user.trainingRecords.filter(r => r.status === "Upcoming").slice(0, 4).map(r => `<div class="list-row"><span>${r.title}</span><span class="muted">${r.date}</span></div>`).join('') || '<p class="muted">No upcoming training scheduled.</p>'}
        </div>
      </div>`;

      }

      if (role === "trainer") {
        renderTrainerDashboard(mount); return;
      }

      // Admin / Executive Overview

      mount.innerHTML = `
    <div class="page-head">
      <div><h1>Management Overview</h1><p class="muted">Mainetti (Bangladesh) Pvt. Ltd. — Company-wide Training &amp; Capability Snapshot${deptFilter !== 'All' ? ` · Filtered: <b>${deptFilter}</b>` : ''}</p></div>
      <div class="ov2-head-actions">

      </div>
    </div>
    <div class="ov2-kpi-grid ov2-kpi-grid-8" id="execKpisAll"></div>
    <div class="panel">
      <h3>Department Training Status</h3>
      <div id="deptStatusTableMount"></div>
    </div>
    <div class="grid-2">
      <div class="panel"><h3>Training Completion by Department</h3><div class="chart-box"><canvas id="chartDeptCompletion"></canvas></div></div>
      <div class="panel"><h3>Assessment Pass Rate Trend</h3><div class="chart-box"><canvas id="chartPassTrend"></canvas></div></div>
    </div>`;

      const gapToRequired = Math.max(0, 90 - kpi.skillCoverage);

      document.getElementById("execKpisAll").innerHTML = [
        ov2KpiCard({
          iconClass: "fa-solid fa-users", iconBg: "#EDE9FE", iconColor: "#7C3AED", title: t('total_manpower'), value: kpi.totalManpower,
          trendText: "No change", trendType: "flat", go: "manpower",
          footerIcon: "fa-solid fa-users", footerText: "Total Employees", footerBg: "#EDE9FE", footerColor: "#7C3AED"
        }),
        ov2KpiCard({
          iconClass: "fa-solid fa-circle-check", iconBg: "#DCFCE7", iconColor: "#16A34A", title: t('training_completed'), value: kpi.trainingCompletionPct + "%",
          progressPct: kpi.trainingCompletionPct, progressColor: "#16A34A",
          trendText: "Target: 85%", trendType: kpi.trainingCompletionPct >= 85 ? "up" : "down", go: "gapdrill:completed",
          footerIcon: "fa-solid fa-arrows-rotate", footerText: Math.max(0, 85 - kpi.trainingCompletionPct) + "% to target", footerBg: "#DCFCE7", footerColor: "#16A34A"
        }),
        ov2KpiCard({
          iconClass: "fa-solid fa-chart-pie", iconBg: "#EDE9FE", iconColor: "#7C3AED", title: t('assessment_pass_rate'), value: kpi.assessmentPassRate + "%",
          progressPct: kpi.assessmentPassRate, progressColor: "#7C3AED",
          trendText: "Pass mark: 70%", trendType: kpi.assessmentPassRate >= 70 ? "up" : "down", go: "gapdrill:pass",
          footerIcon: "fa-solid fa-arrow-up-right", footerText: kpi.assessmentPassRate >= 70 ? "Above pass mark" : "Below pass mark", footerBg: "#EDE9FE", footerColor: "#7C3AED"
        }),
        ov2KpiCard({

          progressPct: kpi.skillCoverage, progressColor: "#F59E0B",

        }),
      ].join('');

      document.getElementById("execKpisAll").innerHTML += [
        ov2KpiCard({

          trendText: kpi.trainingGapEmployees + " employees affected", trendType: "down", go: "gapdrill:gap",
          footerIcon: "fa-solid fa-triangle-exclamation", footerText: "Action needed", footerBg: "#FEE2E2", footerColor: "#DC2626"
        }),
        ov2KpiCard({
          iconClass: "fa-solid fa-play", iconBg: "#DBEAFE", iconColor: "#2563EB", title: t('active_training'), value: kpi.activeTraining,

        }),

      ), {

              route();

          });
