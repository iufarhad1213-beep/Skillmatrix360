    function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

    function openKpiDrilldown(kind) {
      const db = App.db;
      if (kind === "gap") {
        const rows = allSkillGapRows(db);
        openModal("Training Gap — " + rows.length + " Records", table(
          ["Employee ID", "Name", "Department", "Skill", "Current", "Required", "Gap"],
          rows.slice(0, 80).map(r => `<tr class="row-click" data-emp="${r.empId}"><td>${r.empId}</td><td>${r.name}</td><td>${r.dept}</td><td>${r.skill}</td><td>Level ${r.current}</td><td>Level ${r.required}</td><td>${skillPill(r.gap)} (-${r.gap})</td></tr>`)
        ), { onOpen: bindRowClicks });
      } else if (kind === "completed") {
        const rows = []; db.employees.forEach(e => e.trainingRecords.forEach(r => rows.push({ ...r, emp: e })));
        openModal("Training Completion Records", table(
          ["Employee", "Department", "Training", "Status", "Date"],
          rows.slice(0, 80).map(r => `<tr class="row-click" data-emp="${r.emp.id}"><td>${r.emp.name} (${r.emp.id})</td><td>${r.department}</td><td>${r.title}</td><td>${statusPill(r.status)}</td><td>${r.date}</td></tr>`)
        ), { onOpen: bindRowClicks });
      } else if (kind === "pass") {
        const rows = []; db.employees.forEach(e => Object.entries(e.attempts).forEach(([cid, list]) => list.filter(a => a.type === "post").forEach(a => rows.push({ emp: e, cid, a }))));

          ["Employee", "Course", "Score", "Result", "Date"],

        ), { onOpen: bindRowClicks });

        const rows = []; db.employees.forEach(e => e.attendance.forEach(a => rows.push({ emp: e, a })));
        openModal("Training Attendance", table(
          ["Employee", "Training", "Date", "Status"],
          rows.slice(0, 80).map(r => `<tr class="row-click" data-emp="${r.emp.id}"><td>${r.emp.name} (${r.emp.id})</td><td>${r.a.title}</td><td>${r.a.date}</td><td>${statusPill(r.a.status)}</td></tr>`)
        ), { onOpen: bindRowClicks });
      }
    }

    function courseTitle(cid) { const c = App.db.courses.find(c => c.id === cid); return c ? c.title : cid; }

    /* ---------- Department-wise Training Status Table (Overview) ---------- */
    const DEPT_META = {
      "Production": { icon: "🏭", color: "#475569" },

      "Supply Chain": { icon: "🚚", color: "#2563EB" },
      "Warehouse": { icon: "📦", color: "#7C3AED" },

      "EHS": { icon: "🦺", color: "#DC2626" },
      "IT": { icon: "💻", color: "#0891B2" },
      "Finance": { icon: "💰", color: "#059669" },
    };
    function buildDeptStatusRows(db, deptFilter) {
      const list = (deptFilter && deptFilter !== "All") ? [deptFilter] : DEPARTMENTS;
      return list.map(d => {
        const emps = db.employees.filter(e => e.department === d);
        const total = emps.length;
        const finished = emps.filter(e => e.trainingRecords.length === 0 || e.trainingRecords.every(r => r.status === "Completed")).length;
        const trainingNeeded = allSkillGapRows(db, d).length;
        const completionPct = pct(finished, total);
        let status, statusClass;
        if (completionPct >= 90) { status = "On Track"; statusClass = "pill-green"; }
        else if (completionPct >= 70) { status = "In Progress"; statusClass = "pill-amber"; }
        else { status = "Needs Attention"; statusClass = "pill-red"; }
        let priority, priorityClass;
        if (trainingNeeded === 0) { priority = "Low"; priorityClass = "pr-low"; }
        else if (completionPct < 70) { priority = "High"; priorityClass = "pr-high"; }
        else { priority = "Medium"; priorityClass = "pr-medium"; }
        return { dept: d, total, finished, trainingNeeded, completionPct, status, statusClass, priority, priorityClass };
      });
    }
    function renderDeptStatusTable(db, deptFilter) {
      const mount = document.getElementById("deptStatusTableMount");
      if (!mount) return;
      const rows = buildDeptStatusRows(db, deptFilter);
      const totals = rows.reduce((a, r) => ({ total: a.total + r.total, finished: a.finished + r.finished, trainingNeeded: a.trainingNeeded + r.trainingNeeded }), { total: 0, finished: 0, trainingNeeded: 0 });
      const totalPct = pct(totals.finished, totals.total);

      const bodyRows = rows.map(r => {
        const meta = DEPT_META[r.dept] || { icon: "🏢", color: "#64748B" };
        return `<tr>
      <td><div class="dept-name-cell"><span class="dept-avatar" style="background:${meta.color}">${meta.icon}</span>${r.dept}</div></td>
      <td>${r.total}</td>
      <td>${r.finished}</td>
      <td>${r.trainingNeeded > 0 ? `<span class="dept-gap-link" data-dept="${r.dept}">${r.trainingNeeded}</span>` : `<span class="muted">0</span>`}</td>
      <td><div class="dept-completion-cell"><span class="dept-completion-pct">${r.completionPct}%</span><div class="dept-progress-track"><div class="dept-progress-fill" style="width:${r.completionPct}%"></div></div></div></td>
      <td><span class="${r.priorityClass}"><span class="pr-dot"></span>${r.priority}</span></td>
      <td><span class="pill ${r.statusClass}">${r.status}</span></td>
    </tr>`;
      }).join('');

      const totalStatus = totalPct >= 90 ? { t: "On Track", c: "pill-green" } : totalPct >= 70 ? { t: "In Progress", c: "pill-amber" } : { t: "Needs Attention", c: "pill-red" };
      const totalPriority = totals.trainingNeeded === 0 ? { t: "Low", c: "pr-low" } : totalPct < 70 ? { t: "High", c: "pr-high" } : { t: "Medium", c: "pr-medium" };

      mount.innerHTML = `

      <table class="dept-status-table">

        <tbody>
          ${bodyRows}
          <tr class="dept-total-row">
            <td><div class="dept-name-cell"><span class="dept-avatar" style="background:var(--red)">👥</span>TOTAL</div></td>
            <td>${totals.total}</td>
            <td>${totals.finished}</td>
            <td>${totals.trainingNeeded > 0 ? `<span class="dept-gap-link" data-dept="All">${totals.trainingNeeded}</span>` : totals.trainingNeeded}</td>
            <td><div class="dept-completion-cell"><span class="dept-completion-pct">${totalPct}%</span><div class="dept-progress-track"><div class="dept-progress-fill" style="width:${totalPct}%"></div></div></div></td>
            <td><span class="${totalPriority.c}"><span class="pr-dot"></span>${totalPriority.t}</span></td>
            <td><span class="pill ${totalStatus.c}">${totalStatus.t}</span></td>
          </tr>
        </tbody>
      </table>
    </div>`;

      mount.querySelectorAll(".dept-gap-link").forEach(link => {
        link.onclick = () => openDeptGapDrilldown(link.dataset.dept);
      });
    }
    function openDeptGapDrilldown(dept) {

      openModal(title, table(

    /* ---------- Job Role & Skill Requirements ---------- */
    function applyRequiredLevelToEmployees(department, skill, newLevel) {
      App.db.employees.forEach(e => {
        if (e.department !== department) return;
        const sk = e.skills.find(s => s.skill === skill);
        if (sk) { sk.required = newLevel; sk.gap = Math.max(0, newLevel - sk.current); }
      });
    }

      db.jobRoles = db.jobRoles || [];
      openModal("Add Job Role & Skill Requirement", `

      <label>Job Role / Designation<input id="jrNewRole" placeholder="e.g. Line Supervisor"/></label>

      <label>Qualification<select id="jrNewQual">${["SSC", "HSC", "Diploma", "Bachelor's", "Master's"].map(q => `<option ${q === 'SSC' ? 'selected' : ''}>${q}</option>`).join('')}</select></label>
    </div>
    <p class="muted">This adds a new required-skill entry for the job role. It does not automatically change any existing employee's current skill records.</p>
    <button class="btn-primary" id="jrAddSaveBtn">Add Requirement</button>
  `, {
        onOpen: (box) => {
          box.querySelector("#jrAddSaveBtn").onclick = () => {
            const jobRole = box.querySelector("#jrNewRole").value.trim();
            const department = box.querySelector("#jrNewDept").value;
            const skill = box.querySelector("#jrNewSkill").value.trim();
            const requiredLevel = parseInt(box.querySelector("#jrNewLevel").value);
            const qualification = box.querySelector("#jrNewQual").value;
            if (!jobRole) { toast("Please enter a job role / designation."); return; }
            if (!skill) { toast("Please enter a required skill."); return; }
            const dup = db.jobRoles.some(r => r.department === department && r.skill.toLowerCase() === skill.toLowerCase());

            const maxNum = db.jobRoles.reduce((m, r) => Math.max(m, parseInt((r.id || "").replace("JR", "")) || 0), 0);
            db.jobRoles.push({ id: "JR" + pad(maxNum + 1, 3), jobRole, department, skill, requiredLevel, qualification });
            saveDB(db);
            closeModal();
            toast("Job role requirement added.");
            renderJobRoles(mount);
          };
        }
      });

    /* ---------- Chart helper ---------- */
    function chart(canvasId, type, data, opts, customPlugins) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      if (App.charts[canvasId]) App.charts[canvasId].destroy();
      const isDark = App.state.theme === 'dark';
      const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';
      const tickColor = isDark ? '#94A3B8' : '#64748B';
      const tooltipBg = isDark ? '#1E293B' : '#0F172A';

      Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
      Chart.defaults.color = tickColor;
      Chart.defaults.borderColor = gridColor;

      const isDonut = type === 'doughnut' || type === 'pie';
      const isLine = type === 'line';

      // subtle rounded bars + consistent dataset styling without clobbering caller-provided colors
      if (type === 'bar') {
        data.datasets.forEach(ds => {
          if (ds.borderRadius === undefined) ds.borderRadius = 6;
          if (ds.maxBarThickness === undefined) ds.maxBarThickness = 42;
          if (ds.borderSkipped === undefined) ds.borderSkipped = false;
        });
      }
      if (isLine) {
        data.datasets.forEach(ds => {
          if (ds.pointRadius === undefined) ds.pointRadius = 3;
          if (ds.pointHoverRadius === undefined) ds.pointHoverRadius = 5;
          if (ds.borderWidth === undefined) ds.borderWidth = 2.5;
          if (ds.pointBackgroundColor === undefined) ds.pointBackgroundColor = ds.borderColor;
          if (ds.pointBorderColor === undefined) ds.pointBorderColor = isDark ? '#141B2E' : '#FFFFFF';
          if (ds.pointBorderWidth === undefined) ds.pointBorderWidth = 2;
        });
      }
      if (isDonut) {
        data.datasets.forEach(ds => {
          if (ds.borderWidth === undefined) ds.borderWidth = 3;
          if (ds.borderColor === undefined) ds.borderColor = isDark ? '#141B2E' : '#FFFFFF';
          if (ds.hoverOffset === undefined) ds.hoverOffset = 6;
        });
      }

      const baseOptions = {
        responsive: true,
        maintainAspectRatio: false,
        resizeDelay: 50,
        animation: { duration: 550, easing: 'easeOutQuart' },
        interaction: { mode: isDonut ? 'nearest' : 'index', intersect: false },
        layout: { padding: { top: 4, right: 4, bottom: 0, left: 0 } },
        plugins: {
          legend: {
            display: isDonut || data.datasets.length > 1,
            position: isDonut ? 'bottom' : 'top',
            align: isDonut ? 'center' : 'end',
            labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 14, font: { size: 12, weight: '500' } }
          },
          tooltip: {
            enabled: true,
            backgroundColor: tooltipBg,
            titleFont: { size: 12.5, weight: '600' },
            bodyFont: { size: 12.5 },
            padding: 10,
            cornerRadius: 8,
            boxPadding: 4,
            displayColors: !isDonut || data.labels.length > 1,
            callbacks: {
              label: (item) => {
                let v = item.formattedValue;
                let label = item.dataset.label || item.label || '';
                return isDonut ? `${item.label}: ${item.raw}` : `${label}: ${v}`;
              }
            }
          }
        },
        scales: isDonut ? {} : {
          x: { grid: { display: false }, ticks: { font: { size: 11.5 } } },
          y: { beginAtZero: true, grid: { color: gridColor, drawTicks: false }, ticks: { font: { size: 11.5 }, precision: 0 } }
        }
      };
      if (isDonut) baseOptions.cutout = '62%';

      const options = deepMergeOptions(baseOptions, opts || {});
      App.charts[canvasId] = new Chart(ctx, { type, data, options, plugins: customPlugins || [] });
    }
    function deepMergeOptions(base, extra) {
      const out = Array.isArray(base) ? base.slice() : { ...base };
      for (const k in extra) {
        if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && base[k] && typeof base[k] === 'object') {
          out[k] = deepMergeOptions(base[k], extra[k]);
        } else {
          out[k] = extra[k];
        }
      }
      return out;
    }
    window.addEventListener('resize', () => {
      clearTimeout(window.__chartResizeT);
      window.__chartResizeT = setTimeout(() => {
        Object.values(App.charts).forEach(c => { try { c.resize(); } catch (e) { } });
      }, 120);
    });
    function drawDeptCompletionChart(db, deptFilter) {
      const deptList = (deptFilter && deptFilter !== "All") ? [deptFilter] : DEPARTMENTS;
      const rows = deptList.map(d => {
        const emps = db.employees.filter(e => e.department === d);
        const total = emps.reduce((a, e) => a + e.trainingRecords.length, 0);
        const done = emps.reduce((a, e) => a + e.trainingRecords.filter(r => r.status === "Completed").length, 0);
        return { dept: d, pct: pct(done, total) };
      }).sort((a, b) => b.pct - a.pct);
      const labels = rows.map(r => r.dept);
      const data = rows.map(r => r.pct);
      const colors = data.map(v => v >= 70 ? "#16A34A" : v >= 40 ? "#D97706" : "#DC2626");
      chart("chartDeptCompletion", "bar", { labels, datasets: [{ label: "Completion %", data, backgroundColor: colors }] }, {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, max: 100, grid: { display: true }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false } } }
      });
    }
    const passRateLabelPlugin = {
      id: "passRateLabelPlugin",
      afterDatasetsDraw(chartInst) {
        const { ctx, data, scales } = chartInst;
        const ds = data.datasets[0];
        const meta = chartInst.getDatasetMeta(0);
        if (!ds || !meta) return;
        ctx.save();
        ctx.font = "700 11px 'Inter', sans-serif";
        ctx.fillStyle = ds.borderColor || "#16A34A";
        ctx.textAlign = "center";
        meta.data.forEach((point, i) => {
          const v = ds.data[i];
          if (v === null || v === undefined) return;
          ctx.fillText(v + "%", point.x, point.y - 10);
        });
        ctx.restore();
      }
    };
    function drawPassTrendChart(db, deptFilter) {
      const dept = (deptFilter && deptFilter !== "All") ? deptFilter : null;
      const scope = dept ? db.employees.filter(e => e.department === dept) : db.employees;
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug"];
      const data = months.map((m, i) => {
        let pass = 0, total = 0;
        scope.forEach(e => Object.values(e.attempts).forEach(list => list.forEach(a => {
          if (a.type === "post" && new Date(a.date).getMonth() === i) { total++; if (a.passed) pass++; }
        })));
        return total ? Math.round(pass / total * 100) : null;
      });
      const target = months.map(() => 80);
      chart("chartPassTrend", "line", {
        labels: months, datasets: [
          { label: "Actual Pass Rate", data, borderColor: "#16A34A", backgroundColor: "rgba(34,197,94,0.15)", fill: true, tension: 0.4 },
          { label: "Target (80%)", data: target, borderColor: "#2563EB", borderDash: [7, 5], pointRadius: 0, pointHoverRadius: 0, fill: false, tension: 0 }
        ]
      }, {
        layout: { padding: { top: 20 } },
        plugins: { legend: { display: true, labels: { usePointStyle: false, boxWidth: 22, boxHeight: 2 } } },
        scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
      }, [passRateLabelPlugin]);
    }

  </script>

    /* ---------- Assessment Question Bank: Excel Upload ---------- */
    const QB_TEMPLATE_HEADERS = ["Assessment", "Type", "Topic", "Question", "Option A", "Option B", "Option C", "Option D", "Correct Answer", "Model Answer", "Explanation"];

    function downloadQuestionTemplate(course) {
      const rows = [
        ["Pre", "MCQ", "Definitions", `What is the main objective of ${course.title}?`, "Reduce paperwork", "Improve safety, quality or efficiency", "Replace supervisors", "Increase working hours", "B", "", "It focuses on improving workplace performance."],
        ["Post", "MCQ", "Procedure", "What must be done before servicing a machine?", "Nothing", "Lockout/Tagout the energy source", "Increase speed", "Call a visitor", "B", "", "LOTO isolates hazardous energy."],
        ["Post", "Written", "Application", `Describe a situation where ${course.title} applies in your work area.`, "", "", "", "", "", "A strong answer names the task, the SOP followed and the action taken.", ""]
      ];
      const ws = XLSX.utils.aoa_to_sheet([QB_TEMPLATE_HEADERS, ...rows]);
      ws['!cols'] = QB_TEMPLATE_HEADERS.map(() => ({ wch: 26 }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Questions");
      const help = XLSX.utils.aoa_to_sheet([
        ["Instructions"],
        ["Assessment: Pre or Post"],
        ["Type: MCQ or Written"],
        ["MCQ: fill Option A-D and Correct Answer (A/B/C/D). At least 2 options required."],
        ["Written: fill Question and Model Answer only."],
        ["Explanation is optional — shown to the employee after a wrong answer."]
      ]);
      help['!cols'] = [{ wch: 80 }];
      XLSX.utils.book_append_sheet(wb, help, "Instructions");
      XLSX.writeFile(wb, `Question_Bank_Template_${course.id}.xlsx`);
    }

    function parseQuestionRows(rows) {
      const out = { pre: { mcq: [], written: [] }, post: { mcq: [], written: [] } }, errors = [];
      rows.forEach((row, i) => {
        const rowNum = i + 2;
        const get = (...keys) => {
          for (const k of keys) {
            const rk = Object.keys(row).find(x => x.trim().toLowerCase() === k.toLowerCase());
            if (rk !== undefined && String(row[rk]).trim() !== "") return String(row[rk]).trim();
          }
          return "";
        };
        const assessRaw = get("Assessment", "Stage");
        const typeRaw = get("Type", "Question Type");
        const qText = get("Question");
        if (!qText) { errors.push(`Row ${rowNum}: Question is empty.`); return; }
        const stage = /post/i.test(assessRaw) ? "post" : "pre";
        const isWritten = /written|descriptive|essay/i.test(typeRaw);
        if (isWritten) {
          out[stage].written.push({ q: qText, model: get("Model Answer") || "Evaluated by the trainer." });
          return;
        }
        const options = [get("Option A"), get("Option B"), get("Option C"), get("Option D")].filter(o => o !== "");
        if (options.length < 2) { errors.push(`Row ${rowNum}: MCQ needs at least 2 options.`); return; }
        const ansRaw = get("Correct Answer", "Answer").toUpperCase();
        let ansIdx = "ABCD".indexOf(ansRaw);
        if (ansIdx < 0 && /^[1-4]$/.test(ansRaw)) ansIdx = parseInt(ansRaw) - 1;
        if (ansIdx < 0) ansIdx = options.findIndex(o => o.toLowerCase() === ansRaw.toLowerCase());
        if (ansIdx < 0 || ansIdx >= options.length) { errors.push(`Row ${rowNum}: Correct Answer must be A/B/C/D.`); return; }
        out[stage].mcq.push({
          id: stage[0].toUpperCase() + "Q" + (out[stage].mcq.length + 1),
          topic: get("Topic") || "General", q: qText, options, answer: ansIdx, explain: get("Explanation")
        });
      });
      return { bank: out, errors };
    }

        if (file.size > maxBytes) { toast(`File too large. Max ${type === 'video' ? '15MB' : '8MB'} for ${type}.`); return; }

        reader.onload = (e) => {
          course.materials = course.materials || [];
          const material = {
            id: "MAT" + Date.now() + Math.floor(Math.random() * 1000),
            type, title: file.name.replace(/\.[^/.]+$/, ''), fileName: file.name,
            dataUrl: e.target.result, sizeLabel: formatBytes(file.size),
            uploadedAt: fmtDate(appToday()), uploadedBy: currentUser().name

            saveDB(App.db);
            toast("Material uploaded.");
            fileInput.value = "";
            renderCourseDetail(course.id);

            course.materials.pop();
            toast("Storage limit reached — please try a smaller file.");

        reader.readAsDataURL(file);
      };

    /* ---------- Simulated Video Player (20s demo, click to play/pause) ---------- */
    function initVideoPlayer(course, user, isEmpLike) {
      const DURATION = 20; // seconds
      const player = document.getElementById("videoPlayer");
      if (!player) return;
      const playBtn = document.getElementById("videoPlayBtn");
      const subLabel = document.getElementById("videoSubLabel");
      const progressBar = document.getElementById("videoProgressBar");
      const timeLabel = document.getElementById("videoTimeLabel");
      const stateLabel = document.getElementById("videoStateLabel");
      const sceneIcon = document.getElementById("videoSceneIcon");
      const sceneCaption = document.getElementById("videoSceneCaption");

      const scenes = buildVideoScenes(course);
      const segLen = DURATION / scenes.length;
      let sceneIdx = -1;

      function showScene(i) {
        if (i === sceneIdx) return;
        sceneIdx = i;
        const s = scenes[Math.min(i, scenes.length - 1)];
        sceneIcon.textContent = s.icon;
        sceneCaption.textContent = s.caption;
        sceneIcon.style.animation = "none";
        void sceneIcon.offsetWidth;
        sceneIcon.style.animation = "";
      }
      showScene(0);

      let elapsed = 0;
      let timer = null;
      let finished = false;
      if (App.videoTimer) clearInterval(App.videoTimer);

      function fmt(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; }

      function tick() {
        elapsed += 0.1;
        if (elapsed >= DURATION) { elapsed = DURATION; finish(); }
        progressBar.style.width = (elapsed / DURATION * 100) + "%";
        timeLabel.textContent = `${fmt(elapsed)} / ${fmt(DURATION)}`;
        showScene(Math.min(scenes.length - 1, Math.floor(elapsed / segLen)));
      }

      function play() {
        if (finished) { elapsed = 0; finished = false; player.classList.remove("done"); showScene(0); }
        player.classList.add("playing");
        playBtn.textContent = "❚❚";
        subLabel.textContent = "Playing…";
        stateLabel.textContent = "Playing";
        clearInterval(timer);
        timer = setInterval(tick, 100);
        App.videoTimer = timer;
      }

      function pause() {
        player.classList.remove("playing");
        playBtn.textContent = "▶";
        subLabel.textContent = "Paused — click to resume";
        stateLabel.textContent = "Paused";
        clearInterval(timer);
        App.videoTimer = null;
      }

      function finish() {
        clearInterval(timer);
        App.videoTimer = null;
        finished = true;
        player.classList.remove("playing");
        player.classList.add("done");
        playBtn.textContent = "↻";
        subLabel.textContent = "Watched — click to replay";
        stateLabel.textContent = "Completed";
        progressBar.style.width = "100%";
        timeLabel.textContent = `${fmt(DURATION)} / ${fmt(DURATION)}`;
        showScene(scenes.length - 1);
        if (isEmpLike && user) {
          const p = progressOf(user, course.id);
          if (!p.completed) {
            const newProg = Math.min(100, p.progress + 25);
            user.progress[course.id] = { progress: newProg, completed: newProg >= 100 };
            saveDB(App.db);
            toast("Video watched — progress updated!");
            const pf = document.querySelector(".panel .progress-bar.big .progress-fill");
            if (pf) pf.style.width = newProg + "%";
            const progLabel = document.querySelector(".course-foot .muted");
            if (progLabel) progLabel.textContent = `Progress: ${newProg}%`;
            const completeBtn = document.getElementById("completeBtn");
            if (completeBtn && newProg >= 100) {
              completeBtn.disabled = true;
              completeBtn.textContent = "Completed ✓";
              const postBtn = document.getElementById("postBtn");
              if (postBtn) postBtn.disabled = false;
            }
          } else {
            toast("Video watched again — nice review!");
          }
        }
      }

      player.addEventListener("click", () => {
        if (player.classList.contains("playing")) pause();
        else play();
      });
    }

      document.querySelectorAll(".go-course").forEach(b => b.onclick = () => navigate("#/course/" + b.dataset.c));
    }

    /* ---------- Assessments Hub ---------- */
    function renderAssessments(mount) {
      const db = App.db, role = App.session.role;
      if (role === "admin") {
        const rows = [];
        db.employees.forEach(e => Object.entries(e.attempts).forEach(([cid, list]) => list.filter(a => a.type === 'post').forEach(a => rows.push({ e, cid, a }))));
        mount.innerHTML = `<div class="page-head"><div><h1>Assessments</h1><p class="muted">All post-assessment results company-wide</p></div></div>
      <div id="assessTable"></div>`;
        document.getElementById("assessTable").innerHTML = table(
          ["Employee", "Course", "Score", "Result", "Date"],
          rows.slice(0, 150).map(r => `<tr class="row-click" data-emp="${r.e.id}"><td>${r.e.name} (${r.e.id})</td><td>${courseTitle(r.cid)}</td><td>${r.a.score}%</td><td>${statusPill(r.a.passed ? 'Passed' : 'Failed')}</td><td>${r.a.date}</td></tr>`)
        );
        bindRowClicks(mount);
        return;
      }
      const user = currentUser();
      const myCourses = role === 'trainer'
        ? db.courses.filter(c => c.dept === 'All' || (user.assignedDept || []).includes(c.dept))
        : db.courses.filter(c => courseVisibleToDept(c, user.department));
      mount.innerHTML = `<div class="page-head"><div><h1>Assessments</h1><p class="muted">Pre/Post assessments for your assigned courses</p></div></div>
    <div class="course-grid" id="aGrid"></div>`;
      document.getElementById("aGrid").innerHTML = myCourses.length ? myCourses.map(c => {
        const prog = progressOf(user, c.id);
        const attempts = user.attempts[c.id] || [];
        const passed = attempts.some(a => a.type === 'post' && a.passed);
        return `<div class="course-card">
      <div class="course-thumb ${c.type}">${c.type === 'pdf' ? '📄' : '▶️'}</div>
      <div class="course-body">
        <h4>${c.title}</h4>
        <div class="course-meta">${c.dept} · ${attempts.length} attempt(s)</div>
        ${passed ? '<div class="banner-success small">✓ Passed</div>' : ''}
        <div class="course-foot">
          <button class="btn-small pre-btn" data-c="${c.id}">Pre-Test</button>
          <button class="btn-primary post-btn" data-c="${c.id}" ${prog.completed ? '' : 'disabled'}>Post-Test</button>
        </div>
      </div>
    </div>`;
      }).join('') : '<p class="muted">No assessments available for your department yet.</p>';
      document.querySelectorAll(".pre-btn").forEach(b => b.onclick = () => startAssessment(b.dataset.c, "pre"));
      document.querySelectorAll(".post-btn").forEach(b => { if (!b.disabled) b.onclick = () => startAssessment(b.dataset.c, "post"); });
    }

    /* ---------- Assessment Engine ---------- */
    function startAssessment(courseId, type) {
      App.state.currentAssessment = { courseId, type, startedAt: Date.now(), timeLimit: 15 * 60 };
      navigate("#/assessmentrun/" + courseId + "_" + type);
    }

    function renderAssessmentRun(param) {
      const mount = document.getElementById("pageMount");
      const [courseId, type] = param.split("_");
      const db = App.db;
      const course = db.courses.find(c => c.id === courseId);
      const mcqs = courseMcqSet(course, type);
      const writtenQs = courseWrittenSet(course, type);
      const totalQ = mcqs.length + writtenQs.length;
      const answers = {};

      let timeLeft = type === 'post' ? 15 * 60 : 8 * 60;
      mount.innerHTML = `
    <div class="assess-header">
      <div><h2>${type === 'pre' ? 'Pre-Assessment' : 'Post-Assessment'}: ${course.title}</h2>
      <p class="muted" id="qProgress">Question 1 of ${totalQ}</p></div>
      <div class="timer" id="timerBox">⏱ ${fmtTime(timeLeft)}</div>
    </div>
    <div class="progress-bar big"><div class="progress-fill" id="qProgressBar" style="width:${100 / totalQ}%"></div></div>
    <div class="panel" id="qContainer"></div>
    <div class="assess-nav">
      <button class="btn-outline" id="prevBtn">Previous</button>
      <div id="qDots" class="q-dots"></div>
      <button class="btn-primary" id="nextBtn">Next</button>
    </div>
  `;
      let idx = 0;
      const questions = [
        ...mcqs.map(q => ({ kind: "mcq", ...q })),
        ...writtenQs.map((w, i) => ({ kind: "written", id: "W" + i, q: w }))
      ];

      function renderQ() {
        const q = questions[idx];
        document.getElementById("qProgress").textContent = `Question ${idx + 1} of ${totalQ}`;
        document.getElementById("qProgressBar").style.width = ((idx + 1) / totalQ * 100) + "%";
        const c = document.getElementById("qContainer");
        if (q.kind === "mcq") {
          c.innerHTML = `<h3>${q.q}</h3><div class="options-list">
        ${q.options.map((o, i) => `<label class="option-row"><input type="radio" name="mcq" value="${i}" ${answers[q.id] === i ? 'checked' : ''}/> ${String.fromCharCode(65 + i)}. ${o}</label>`).join('')}
      </div>`;
          c.querySelectorAll("input[name=mcq]").forEach(inp => inp.onchange = () => { answers[q.id] = parseInt(inp.value); renderDots(); });
        } else {
          c.innerHTML = `<h3>Written Question</h3><p>${q.q}</p><textarea id="writtenArea" rows="6" placeholder="Type your answer here...">${answers[q.id] || ''}</textarea>`;
          document.getElementById("writtenArea").oninput = (e) => { answers[q.id] = e.target.value; renderDots(); };
        }
        document.getElementById("prevBtn").disabled = idx === 0;
        document.getElementById("nextBtn").textContent = idx === questions.length - 1 ? "Submit Assessment" : "Next";
        renderDots();
      }
      function renderDots() {
        document.getElementById("qDots").innerHTML = questions.map((q, i) => {
          const answered = answers[q.id] !== undefined && answers[q.id] !== '';
          return `<span class="qdot ${i === idx ? 'active' : ''} ${answered ? 'answered' : ''}"></span>`;
        }).join('');
      }
      document.getElementById("prevBtn").onclick = () => { if (idx > 0) { idx--; renderQ(); } };
      document.getElementById("nextBtn").onclick = () => {
        if (idx < questions.length - 1) { idx++; renderQ(); }
        else { clearInterval(timerHandle); submitAssessment(course, type, questions, answers); }
      };
      renderQ();

      const timerHandle = setInterval(() => {
        timeLeft--;
        const tb = document.getElementById("timerBox");
        if (tb) tb.textContent = "⏱ " + fmtTime(timeLeft);
        if (timeLeft <= 0) { clearInterval(timerHandle); submitAssessment(course, type, questions, answers); }
      }, 1000);
    }
    function fmtTime(s) { const m = Math.floor(s / 60), sec = s % 60; return `${pad(m, 2)}:${pad(sec, 2)}`; }

    function submitAssessment(course, type, questions, answers) {
      const user = currentUser();
      const mcqQuestions = questions.filter(q => q.kind === "mcq");
      const writtenQuestions = questions.filter(q => q.kind === "written");
      let correct = 0, wrong = 0, unanswered = 0;
      const detail = [];
      mcqQuestions.forEach(q => {
        const given = answers[q.id];
        if (given === undefined) { unanswered++; detail.push({ q, given: null, correct: false }); }
        else if (given === q.answer) { correct++; detail.push({ q, given, correct: true }); }
        else { wrong++; detail.push({ q, given, correct: false }); }
      });
      const score = Math.round((correct / mcqQuestions.length) * 100);
      const passed = score >= 70;
      const writtenAnswers = writtenQuestions.map((w, i) => ({ question: w.q, answer: answers[w.id] || "(No answer provided)", model: courseModelAnswer(course, type, i) }));

      user.attempts[course.id] = user.attempts[course.id] || [];
      const attemptRecord = { date: new Date().toISOString().slice(0, 10), type, score, passed, detail, writtenAnswers };
      user.attempts[course.id].push(attemptRecord);

      user.notifications = user.notifications || [];
      if (type === 'post' && passed) {
        const tr = user.trainingRecords.find(r => r.courseId === course.id);
        if (tr) { tr.status = "Completed"; tr.completedDate = attemptRecord.date; }
        ensureCertificate(user, course, score);
        user.notifications.unshift({
          id: "NP" + user.id + course.id + Date.now(), type: "training_passed", read: false, date: attemptRecord.date,
          title: "Congratulations! 🎉",
          body: `You have passed the assessment for "${course.title}" with a score of ${score}%. Congratulations on completing the training!`,
          sms: `Dear ${user.id}, congratulations! You passed "${course.title}" with ${score}%.`
        });
      } else if (type === 'post' && !passed) {
        const tr = user.trainingRecords.find(r => r.courseId === course.id);
        if (tr) tr.status = "Development Required";
        user.notifications.unshift({
          id: "NF" + user.id + course.id + Date.now(), type: "training_failed", read: false, date: attemptRecord.date,
          title: "Assessment Result — Try Again",
          body: `You scored ${score}% in "${course.title}", which is below the passing mark. Please review the material and try again.`,
          sms: `Dear ${user.id}, you scored ${score}% in "${course.title}". Please review and try again.`
        });
      }
      saveDB(App.db);
      App.state.lastResult = { userId: user.id, courseId: course.id, attemptIndex: user.attempts[course.id].length - 1, type };
      navigate("#/result/" + course.id + "_" + (user.attempts[course.id].length - 1));
    }

    function ensureCertificate(user, course, score) {
      user.certificates = user.certificates || [];
      if (user.certificates.some(c => c.courseId === course.id)) return;
      user.certificates.push({
        id: "CERT-" + user.id + "-" + course.id + "-" + Date.now().toString().slice(-5),
        courseId: course.id, courseTitle: course.title, date: new Date().toISOString().slice(0, 10),
        score, trainer: pick(TRAINER_POOL)
      });
    }

    function renderResult(param) {
      const mount = document.getElementById("pageMount");
      const [courseId, attemptIdxStr] = param.split("_");
      const attemptIdx = parseInt(attemptIdxStr);
      const user = currentUser();
      const course = App.db.courses.find(c => c.id === courseId);
      const attempts = user.attempts[courseId] || [];
      const a = attempts[attemptIdx];
      if (!a) { mount.innerHTML = "<p>Result not found.</p>"; return; }
      const mcqCount = a.detail.length;
      const correct = a.detail.filter(d => d.correct).length;
      const wrong = a.detail.filter(d => !d.correct && d.given !== null).length;
      const unanswered = a.detail.filter(d => d.given === null).length;

      mount.innerHTML = `
    <div class="result-header ${a.passed ? 'pass' : 'fail'}">
      <div class="result-score">${a.score}%</div>
      <div>
        <h2>${a.passed ? 'PASSED' : 'Development Required'}</h2>
        <p class="muted">${a.type === 'pre' ? 'Pre-Assessment' : 'Post-Assessment'} · ${course.title} · Pass Mark: 70%</p>
      </div>
    </div>
    <div class="kpi-grid">
      ${kpiCard("✅", "Correct Answers", correct)}
      ${kpiCard("❌", "Wrong Answers", wrong)}
      ${kpiCard("➖", "Unanswered", unanswered)}
    </div>
    ${a.passed ? `<div class="banner-success">🎉 Congratulations! Certificate generated. <a href="#/certificates">View Certificates →</a></div>` : `
    <div class="panel dev-panel">
      <h3>Development Required</h3>
      <p>You have not achieved the required score (70%). Review the weak topics below, then retake the assessment.</p>
      <h4>Weak Topics</h4>
      <div class="weak-topics">${weakTopics(a.detail).map(w => `<span class="pill pill-red">${w} — Weak</span>`).join(' ')}</div>
      <div class="dev-actions">
        <a href="#/course/${course.id}" class="btn-outline">Review Learning Material</a>
        <button class="btn-primary" id="retakeBtn">Retake Assessment</button>
      </div>
    </div>`}
    <div class="panel">
      <h3>Answer Review</h3>
      ${a.detail.map((d, i) => `
        <div class="answer-row ${d.correct ? 'ok' : 'bad'}">
          <div>${d.correct ? '✅' : '❌'} Question ${i + 1}: ${d.q.q}</div>
          <div class="muted">Your Answer: ${d.given !== null ? String.fromCharCode(65 + d.given) + '. ' + d.q.options[d.given] : '(Unanswered)'}</div>
          ${!d.correct ? `<div class="muted">Correct Answer: ${String.fromCharCode(65 + d.q.answer)}. ${d.q.options[d.q.answer]}</div><div class="explain">Explanation: ${d.q.explain || `The correct procedure follows the standard SOP for ${d.q.topic}.`}</div>` : ''}
        </div>`).join('')}
      ${a.writtenAnswers.map((w, i) => `
        <div class="answer-row written">
          <div><b>Written Question ${i + 1}:</b> ${w.question}</div>
          <div class="written-compare">
            <div><label>Your Written Answer</label><p>${w.answer}</p></div>
            <div><label>Trainer / Model Answer</label><p>${w.model}</p></div>
          </div>
        </div>`).join('')}
    </div>
    <h4>Attempt History</h4>
    ${table(["Attempt", "Type", "Score", "Result"], attempts.map((att, i) => `<tr><td>Attempt ${i + 1}</td><td>${att.type}</td><td>${att.score}%</td><td>${statusPill(att.passed ? 'Passed' : 'Failed')}</td></tr>`))}
  `;
      const retake = document.getElementById("retakeBtn");
      if (retake) retake.onclick = () => startAssessment(course.id, "post");
    }
    function weakTopics(detail) {
      const topics = new Set();
      detail.filter(d => !d.correct).forEach(d => topics.add(d.q.topic));
      return [...topics];
    }

  </script>
  <script>
    /* =========================================================

       Certificates, Notifications, Profile, Admin, Trainer
       ========================================================= */

    /* ---------- Training Schedule ---------- */

    <div class="page-head">

      <div class="view-toggle" style="gap:10px;">
        <select class="select" id="scheduleStatusSelect">${statusOptions.map(s => `<option value="${s}" ${statusFilter === s ? 'selected' : ''}>${s === 'All' ? 'All Status' : s}</option>`).join('')}</select>

        </div>
      </div>`).join('')}</div>` : `<p class="muted">No ${statusFilter !== 'All' ? statusFilter + ' ' : ''}training sessions found.</p>`;
        bindScheduleActions();
      }
      function showCal() {

        document.getElementById("scheduleBody").innerHTML = `<div class="cal-grid">${months.map((m, i) => {
          const items = list.filter(s => new Date(s.date).getMonth() === i);
          return `<div class="cal-month"><h4>${m}</h4>${items.length ? items.map(s => `<div class="cal-item view-detail" data-id="${s.id}">${new Date(s.date).getDate()} — ${s.title}</div>`).join('') : '<p class="muted">No sessions</p>'}</div>`;
        }).join('')}</div>`;
        bindScheduleActions();
      }
      function bindScheduleActions() {
        document.querySelectorAll(".view-detail").forEach(b => b.onclick = () => showTrainingDetail(b.dataset.id));
        document.querySelectorAll(".dl-meeting").forEach(b => b.onclick = () => downloadMeeting(b.dataset.id));
      }
      document.getElementById("viewList").onclick = showList;
      document.getElementById("viewCal").onclick = showCal;

    }
    function showTrainingDetail(id) {
      const s = App.db.schedule.find(x => x.id === id);
      const course = App.db.courses.find(c => c.id === s.courseId);
      openModal(s.title, `
    <div class="detail-grid">
      <div><label>Date</label><span>${s.date}</span></div>
      <div><label>Time</label><span>${s.time}</span></div>
      <div><label>Venue</label><span>${s.venue}</span></div>
      <div><label>Department</label><span>${s.department}</span></div>
      <div><label>Trainer</label><span>${s.trainer}</span></div>
      <div><label>Duration</label><span>${s.duration}</span></div>
      <div><label>Status</label><span>${statusPill(s.status)}</span></div>
      <div><label>Participants</label><span>${s.participants.length}</span></div>
    </div>
    <h4>Agenda</h4>
    <ul class="obj-list"><li>Introduction & objectives</li><li>Core content: ${course ? course.title : s.title}</li><li>Practical demonstration / discussion</li><li>Q&A and assessment briefing</li></ul>
    <button class="btn-primary" id="dlBtn">Download Meeting / Training Plan</button>
  `, { onOpen: (box) => { box.querySelector("#dlBtn").onclick = () => downloadMeeting(s.id); } });
    }
    function downloadMeeting(id) {

      const course = App.db.courses.find(c => c.id === s.courseId);

    }
    function buildTrainingPlanPosterHTML(s, course) {

    }
    async function generateTrainingPlanPDF(s, course) {
      const holder = document.createElement("div");
      holder.className = "tp-poster";
      holder.innerHTML = buildTrainingPlanPosterHTML(s, course);
      document.body.appendChild(holder);
      try {
        const canvas = await html2canvas(holder, { scale: 2, backgroundColor: "#EEF1F9", useCORS: true });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? "landscape" : "portrait", unit: "px", format: [canvas.width, canvas.height] });
        pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width, canvas.height);
        pdf.save(`${s.id}_${s.title.replace(/\s+/g, '_')}_Training_Plan.pdf`);
        toast("Training plan PDF downloaded.");
      } catch (err) {
        console.error(err);

    function readImageAsDataURL(file, maxSize, onDone, onError) {
      const reader = new FileReader();
      reader.onerror = () => { if (onError) onError(); };
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => { if (onError) onError(); };
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
          else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          try { onDone(canvas.toDataURL("image/jpeg", 0.85)); }
          catch (err) { if (onError) onError(); }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function generateSkillsForDept(department) {
      const skillsList = SKILLS_BY_DEPT[department] || [];
      return skillsList.map(sk => {
        const required = randInt(2, 4);
        let current = Math.max(0, required - randInt(-1, 3));
        current = Math.min(5, current);
        return { skill: sk, required, current, gap: Math.max(0, required - current) };
      });
    }

    function normalizeImportDate(val) {
      if (val instanceof Date && !isNaN(val)) return fmtDate(val);
      if (val) {
        const asDate = new Date(val);
        if (!isNaN(asDate.getTime())) return fmtDate(asDate);
      }
      return fmtDate(appToday());
    }

    function downloadEmployeeTemplate() {
      const sampleRows = [
        ["", "Karim Hasan", "Male", "Production", "Machine Operator", "Permanent", "2024-01-15", "Md. Anwar Hossain"],
        ["EMP1001", "Fatema Begum", "Female", "Quality", "QC Executive", "Contract", "2023-06-01", "Admin"]
      ];
      const ws = XLSX.utils.aoa_to_sheet([EMP_IMPORT_TEMPLATE_HEADERS, ...sampleRows]);
      ws['!cols'] = EMP_IMPORT_TEMPLATE_HEADERS.map(() => ({ wch: 20 }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Employees");
      const deptWs = XLSX.utils.aoa_to_sheet([["Existing Departments (any other name typed in the Department column will be auto-created)"], ...DEPARTMENTS.map(d => [d])]);
      deptWs['!cols'] = [{ wch: 60 }];
      XLSX.utils.book_append_sheet(wb, deptWs, "Departments");
      XLSX.writeFile(wb, "Employee_Import_Template.xlsx");
    }

    function importEmployeeRows(db, rows, replaceAll) {
      const result = { added: 0, updated: 0, errors: [], removed: 0, newDepartments: [] };
      if (replaceAll) {
        result.removed = db.employees.length;
        db.employees = [];
        db.schedule = [];
      }
      const usedNewIds = new Set();
      const normDept = (val) => {
        if (!val) return null;
        const before = DEPARTMENTS.length;
        const dept = ensureDepartment(val);
        if (dept && DEPARTMENTS.length > before) result.newDepartments.push(dept);
        return dept;
      };
      rows.forEach((row, idx) => {
        const rowNum = idx + 2; // +2 to account for header row and 1-based numbering
        const get = (...keys) => {
          for (const k of keys) {
            const foundKey = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
            if (foundKey !== undefined && String(row[foundKey]).trim() !== "") return String(row[foundKey]).trim();
          }
          return "";
        };
        const empId = get("Employee ID", "EmpID", "ID");
        const name = get("Full Name", "Name");
        const genderRaw = get("Gender");
        const deptRaw = get("Department", "Dept");
        const designation = get("Designation", "Title");
        const empTypeRaw = get("Employment Type", "Type");
        const joiningRaw = get("Joining Date", "Joining", "Date of Joining");
        const supervisor = get("Supervisor") || pick(SUPERVISOR_POOL);

        if (!name) { result.errors.push({ row: rowNum, reason: "Missing Full Name." }); return; }
        if (!deptRaw) { result.errors.push({ row: rowNum, reason: "Missing Department." }); return; }
        const department = normDept(deptRaw);
        if (!designation) { result.errors.push({ row: rowNum, reason: "Missing Designation." }); return; }
        const empType = /contract/i.test(empTypeRaw) ? "Contract" : "Permanent";
        const gender = /female/i.test(genderRaw) ? "Female" : "Male";

        let emp = empId ? db.employees.find(e => e.id.toLowerCase() === empId.toLowerCase()) : null;
        if (emp) {
          const deptChanged = emp.department !== department;
          emp.name = name; emp.gender = gender; emp.department = department;
          emp.designation = designation; emp.empType = empType;
          emp.joining = normalizeImportDate(joiningRaw);
          emp.supervisor = supervisor;
          emp.photoInitials = name.split(' ').map(p => p[0]).slice(0, 2).join('');
          if (deptChanged) { emp.skills = generateSkillsForDept(department); }
          result.updated++;
        } else {
          let newId = empId;
          if (!newId || db.employees.find(e2 => e2.id.toLowerCase() === newId.toLowerCase()) || usedNewIds.has(newId.toLowerCase())) {
            const maxNum = Math.max(1000, ...db.employees.map(e => parseInt(e.id.replace("EMP", "")) || 1000), ...[...usedNewIds].map(i => parseInt(i.replace("EMP", "")) || 1000));
            newId = "EMP" + (maxNum + 1);
          }
          usedNewIds.add(newId.toLowerCase());
          db.employees.push({
            id: newId, name, gender, department, designation, empType,
            joining: normalizeImportDate(joiningRaw), supervisor, skills: generateSkillsForDept(department),
            photoInitials: name.split(' ').map(p => p[0]).slice(0, 2).join(''),
            password: "Mainetti@123", role: "employee", attempts: {}, trainingRecords: [], attendance: [], notifications: [], progress: {}, certificates: []
          });
          result.added++;
        }
      });
      if (replaceAll) {
        // Departments should mirror the upload exactly: keep only departments actually used by the imported employees.
        const usedDepts = new Set(db.employees.map(e => e.department));
        DEPARTMENTS.length = 0;
        usedDepts.forEach(d => DEPARTMENTS.push(d));
      }
      db.departments = [...DEPARTMENTS];
      return result;
    }

                const data = new Uint8Array(ev.target.result);

                runBtn.disabled = true;
              }

            reader.readAsArrayBuffer(file);

          ${result.newDepartments.length ? `<span class="chip" style="background:var(--amber-bg); color:var(--amber); border:none;">${result.newDepartments.length} New Dept(s)</span>` : ''}
          <span class="chip" style="background:var(--red-bg); color:var(--red); border:none;">${result.errors.length} Skipped</span>
        </div>
        ${result.newDepartments.length ? `<p class="muted" style="margin:0 0 8px;">New departments created: ${result.newDepartments.join(', ')}</p>` : ''}
        ${result.errors.length ? `<div style="max-height:140px; overflow:auto; font-size:12px; color:var(--red); background:var(--red-bg); padding:10px; border-radius:10px;">${result.errors.map(er => `Row ${er.row}: ${er.reason}`).join('<br/>')}</div>` : ''}
      `;
            toast(replaceAll ? `Demo data cleared — ${result.added} employees imported.` : `Import complete — ${result.added} added, ${result.updated} updated.`);
            runBtn.textContent = "Import Employees";

          };
        }
      });
    }

            if (!dateVal) { toast("Please select a training date."); return; }
            const course = db.courses.find(c => c.id === courseId);
            const trDate = new Date(dateVal);
            const status = trDate < appToday() ? "Completed" : (trDate < addDays(appToday(), 14) ? "Upcoming" : "Planned");

            // Auto-find a matching session (same course/date/time/venue) else create a new schedule entry
            let session = db.schedule.find(s => s.courseId === courseId && s.date === dateVal && s.venue === venue && s.time === time);
            if (!session) {
              const maxNum = db.schedule.reduce((m, s) => Math.max(m, parseInt((s.id || "").replace("TRN", "")) || 0), 0);
              session = {
                id: "TRN" + pad(maxNum + 1, 3), title: course.title + " Training", courseId: course.id, department: course.dept,

              session.status = status;
            }
            if (!session.participants.includes(emp.id)) session.participants.push(emp.id);

            emp.trainingRecords = emp.trainingRecords || [];
            let tr = emp.trainingRecords.find(r => r.trainingId === session.id);
            if (!tr) {
              tr = { trainingId: session.id, title: session.title, courseId: session.courseId, department: session.department, date: session.date, status: status, completedDate: null };
              emp.trainingRecords.push(tr);
            } else {
              tr.date = session.date; tr.status = status;
            }

            emp.notifications = emp.notifications || [];
            emp.notifications.unshift({
              id: "NA" + emp.id + session.id + Date.now(), type: "training_assigned", read: false, date: fmtDate(appToday()),

              body: `You have been assigned to "${session.title}" on ${session.date} at ${session.time}, ${session.venue}.`,
              sms: `Dear ${emp.id}, you are scheduled for "${session.title}" on ${session.date} at ${session.time}.`
            });

            saveDB(db); closeModal(); toast("Training assigned — schedule updated & notification sent.");
            if (onSave) onSave();
          };
        }
      });
    }

      <label>Subject / Course<select id="atCourse">${courseList.map(c => `<option value="${c.id}">${c.title} (${c.dept === 'All' ? 'All Depts' : c.dept})</option>`).join('')}</select></label>
      <label>Training Date<input type="date" id="atDate" min="${fmtDate(appToday())}" value="${fmtDate(addDays(appToday(), 7))}"/></label>
      <label>Time<select id="atTime">${TRAINING_TIMES.map(tm => `<option>${tm}</option>`).join('')}</select></label>
      <label>Location / Venue<select id="atVenue">${atOptionsHtml(db.venues)}</select></label>
      <label>Trainer<select id="atTrainer">${atOptionsHtml(db.trainers)}</select></label>
    </div>
    <div id="bulkSkipNote"></div>
    <button class="btn-primary" id="atBulkSaveBtn">Assign Training to ${emps.length} Employees</button>
  `, {
        onOpen: (box) => {
          box.querySelector("#atBulkSaveBtn").onclick = () => {
            const courseId = box.querySelector("#atCourse").value;
            const dateVal = box.querySelector("#atDate").value;
            const time = box.querySelector("#atTime").value;
            const venue = box.querySelector("#atVenue").value;
            const trainer = box.querySelector("#atTrainer").value;
            if (!dateVal) { toast("Please select a training date."); return; }
            const course = db.courses.find(c => c.id === courseId);
            const trDate = new Date(dateVal);
            const status = trDate < appToday() ? "Completed" : (trDate < addDays(appToday(), 14) ? "Upcoming" : "Planned");

            let assigned = 0, skipped = 0;
            emps.forEach(emp => {
              if (!courseVisibleToDept(course, emp.department)) { skipped++; return; }
              let session = db.schedule.find(s => s.courseId === courseId && s.date === dateVal && s.venue === venue && s.time === time);
              if (!session) {
                const maxNum = db.schedule.reduce((m, s) => Math.max(m, parseInt((s.id || "").replace("TRN", "")) || 0), 0);
                session = {
                  id: "TRN" + pad(maxNum + 1, 3), title: course.title + " Training", courseId: course.id, department: course.dept,
                  date: dateVal, time, venue, duration: course.duration, trainer, participants: [], status
                };
                db.schedule.push(session);
              } else {
                session.status = status;
              }
              if (!session.participants.includes(emp.id)) session.participants.push(emp.id);

              emp.trainingRecords = emp.trainingRecords || [];
              let tr = emp.trainingRecords.find(r => r.trainingId === session.id);
              if (!tr) {
                tr = { trainingId: session.id, title: session.title, courseId: session.courseId, department: session.department, date: session.date, status: status, completedDate: null };
                emp.trainingRecords.push(tr);
              } else {
                tr.date = session.date; tr.status = status;
              }

              emp.notifications = emp.notifications || [];
              emp.notifications.unshift({
                id: "NA" + emp.id + session.id + Date.now(), type: "training_assigned", read: false, date: fmtDate(appToday()),
                title: "Training Assigned",
                body: `You have been assigned to "${session.title}" on ${session.date} at ${session.time}, ${session.venue}.`,
                sms: `Dear ${emp.id}, you are scheduled for "${session.title}" on ${session.date} at ${session.time}.`
              });
              assigned++;
            });

            saveDB(db);
            closeModal();
            toast(`Training assigned to ${assigned} employee(s)${skipped ? `, ${skipped} skipped (department mismatch)` : ''}.`);
            if (onSave) onSave();
          };
        }
      });
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>

</html>
